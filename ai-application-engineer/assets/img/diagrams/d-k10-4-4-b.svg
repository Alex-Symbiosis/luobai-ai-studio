<text class="f-h" x="40" y="28">同一份数据，三种处理的测试 MAE</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 62 L100 300"/><rect x="170.2" y="274.13009999999997" width="119.60000000000001" height="25.8699" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="230.0" y="266.13009999999997">12.319%</text><text class="f-sc" x="230.0" y="318">保留</text><rect x="430.2" y="273.9558" width="119.60000000000001" height="26.0442" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="490.0" y="265.9558">12.402%</text><text class="f-sc" x="490.0" y="318">截断 p5/p95</text><rect x="690.2" y="300.0" width="119.60000000000001" height="0.0" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="750.0" y="292.0">0.0%</text><text class="f-sc" x="750.0" y="318">剔除</text><text class="f-s" x="100" y="344">错误在标签而不在特征时，截断特征几乎无用甚至更差；先判成因再选手段。</text>
