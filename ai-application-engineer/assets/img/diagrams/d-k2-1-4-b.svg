.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="40" y="28">量越大，流片的一次性成本摊得越薄</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M110 282 L200 240 L300 205 L420 175 L560 150 L700 132 L880 118" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">ASIC 单颗成本</text><path d="M110 150 L300 146 L560 142 L880 136" fill="none" stroke="#d98b3a" stroke-width="2.4"/><line x1="700" y1="90" x2="726" y2="90" stroke="#d98b3a" stroke-width="2.6"/><text class="f-s" x="734" y="94">GPU / FPGA 单颗成本</text><circle class="f-pt" cx="634" cy="140" r="6"/><text class="f-s" x="644" y="132">盈亏平衡点</text><text class="f-s" x="880" y="322" text-anchor="end">量产规模 →</text><text class="f-s" x="92" y="66" text-anchor="end">单颗成本</text><text class="f-s" x="100" y="340">量小用现货，量大再流片；这个交点就是「值不值得开模」的分界。</text>
