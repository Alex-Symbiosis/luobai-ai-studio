<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="六项能力体检，而不是一次 IQ 测试">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">六项能力体检，而不是一次 IQ 测试</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">能力</text><text class="f-t" x="352.0" y="98">问什么</text><text class="f-t" x="632.0" y="98">扫地机器人（示意）</text><rect class="f-b3" x="60" y="112.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="132.66666666666669">感知</text><text class="f-s" x="352.0" y="132.66666666666669">能不能读取环境</text><text class="f-s" x="632.0" y="132.66666666666669">有：碰撞、红外</text><rect class="f-b3" x="60" y="143.33333333333334" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="164.0">记忆</text><text class="f-s" x="352.0" y="164.0">能不能保存地图</text><text class="f-s" x="632.0" y="164.0">部分：局部地图</text><rect class="f-b3" x="60" y="174.66666666666666" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="195.33333333333331">推理</text><text class="f-s" x="352.0" y="195.33333333333331">能不能推断位置</text><text class="f-s" x="632.0" y="195.33333333333331">有：简单路径推断</text><rect class="f-b3" x="60" y="206.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="226.66666666666666">学习</text><text class="f-s" x="352.0" y="226.66666666666666">能不能从数据改进</text><text class="f-s" x="632.0" y="226.66666666666666">弱：多为固定策略</text><rect class="f-b3" x="60" y="237.33333333333331" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="258.0">决策</text><text class="f-s" x="352.0" y="258.0">能不能选下一步</text><text class="f-s" x="632.0" y="258.0">有：覆盖式清扫</text><rect class="f-b3" x="60" y="268.66666666666663" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="289.3333333333333">表达</text><text class="f-s" x="352.0" y="289.3333333333333">能不能说明理由</text><text class="f-s" x="632.0" y="289.3333333333333">无：不解释</text><text class="f-s" x="60" y="328.0">单项得分高不等于智能；看六项的组合与短板，比看一个总分更有解释力。</text>
</svg>
