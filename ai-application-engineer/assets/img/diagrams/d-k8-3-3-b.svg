<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="一个点归哪组，只看距离">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="40" y="28">一个点归哪组，只看距离</text><rect class="f-b3" x="60" y="46" width="840" height="238" rx="10"/><path class="f-dash" d="M230 110 L300 150"/><circle cx="230" cy="110" r="6" fill="#2f6fd0" opacity="0.85"/><path class="f-dash" d="M268 182 L300 150"/><circle cx="268" cy="182" r="6" fill="#2f6fd0" opacity="0.85"/><path class="f-dash" d="M355 120 L300 150"/><circle cx="355" cy="120" r="6" fill="#2f6fd0" opacity="0.85"/><path class="f-dash" d="M585 150 L640 200"/><circle cx="585" cy="150" r="6" fill="#2f6fd0" opacity="0.85"/><path class="f-dash" d="M700 140 L640 200"/><circle cx="700" cy="140" r="6" fill="#2f6fd0" opacity="0.85"/><path class="f-dash" d="M700 250 L640 200"/><circle cx="700" cy="250" r="6" fill="#2f6fd0" opacity="0.85"/><path class="f-dash" d="M470 175 L300 150"/><path class="f-dash" d="M470 175 L640 200"/><circle class="f-pt" cx="470" cy="175" r="6"/><text class="f-s" x="360" y="224">两边一样远：平局要定规则</text><path d="M291 141 L309 159" stroke="#d9534f" stroke-width="2.4"/><path d="M291 159 L309 141" stroke="#d9534f" stroke-width="2.4"/><text class="f-sc" x="300" y="202">簇心 A</text><path d="M631 191 L649 209" stroke="#d9534f" stroke-width="2.4"/><path d="M631 209 L649 191" stroke="#d9534f" stroke-width="2.4"/><text class="f-sc" x="640" y="252">簇心 B</text><text class="f-s" x="90" y="272">虚线长度 = 到簇心的距离</text><text class="f-s" x="60" y="322">分到哪一组只看它到哪个簇心更近；距离定义一变，边界就跟着变。</text>
</svg>
