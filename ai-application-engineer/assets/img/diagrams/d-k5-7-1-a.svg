<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="最大间隔与支持向量">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="40" y="28">最大间隔与支持向量</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><circle cx="200" cy="230" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="280" cy="250" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="360" cy="210" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="440" cy="236" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="520" cy="190" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="600" cy="214" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="680" cy="176" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="760" cy="200" r="5.5" fill="#2f6fd0" opacity="0.8"/><path d="M140 300 L840 150" fill="none" stroke="#2f6fd0" stroke-width="2.6"/><line x1="680" y1="72" x2="706" y2="72" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="714" y="76">分界超平面</text><path d="M140 250 L840 100" fill="none" stroke="#9db9d8" stroke-width="2.6" stroke-dasharray="6 4"/><line x1="680" y1="94" x2="706" y2="94" stroke="#9db9d8" stroke-width="2.6"/><text class="f-s" x="714" y="98">上间隔</text><path d="M140 350 L840 200" fill="none" stroke="#9db9d8" stroke-width="2.6" stroke-dasharray="6 4"/><line x1="680" y1="116" x2="706" y2="116" stroke="#9db9d8" stroke-width="2.6"/><text class="f-s" x="714" y="120">下间隔</text><text class="f-s" x="100" y="340">能分开的线有无数条；最大间隔挑的是离最近点最远的那条，边界只由支持向量决定。</text>
</svg>
