<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="三种抽取路线，各有短板">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">三种抽取路线，各有短板</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">方法</text><text class="f-t" x="240.0" y="98">精度</text><text class="f-t" x="408.0" y="98">召回</text><text class="f-t" x="576.0" y="98">规模</text><text class="f-t" x="744.0" y="98">人工成本</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">规则 / 模板</text><text class="f-s" x="240.0" y="139.0">模式内很高</text><text class="f-s" x="408.0" y="139.0">模式外易漏</text><text class="f-s" x="576.0" y="139.0">小</text><text class="f-s" x="744.0" y="139.0">写规则费人</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">监督学习</text><text class="f-s" x="240.0" y="183.0">较高</text><text class="f-s" x="408.0" y="183.0">较高</text><text class="f-s" x="576.0" y="183.0">中，依赖标注</text><text class="f-s" x="744.0" y="183.0">标注最贵</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">远程监督</text><text class="f-s" x="240.0" y="227.0">偏低，噪声标签</text><text class="f-s" x="408.0" y="227.0">高</text><text class="f-s" x="576.0" y="227.0">大</text><text class="f-s" x="744.0" y="227.0">省标注，要抽检</text><text class="f-s" x="60" y="272">先用规则保底，再用模型扩召回；远程监督必须配去噪与抽检。</text>
</svg>
