<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="四类泄漏，四种「指标虚高」">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">四类泄漏，四种「指标虚高」</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">类型</text><text class="f-t" x="282.0" y="98">典型做法</text><text class="f-t" x="492.0" y="98">为什么错</text><text class="f-t" x="702.0" y="98">怎么查</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">预处理泄漏</text><text class="f-s" x="282.0" y="139.0">先对全量数据标准化再划分</text><text class="f-s" x="492.0" y="139.0">测试集信息进入训练</text><text class="f-s" x="702.0" y="139.0">把变换放进 Pipeline</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">特征泄漏</text><text class="f-s" x="282.0" y="183.0">用了预测时刻拿不到的特征</text><text class="f-s" x="492.0" y="183.0">上线时该特征不存在</text><text class="f-s" x="702.0" y="183.0">逐特征问「何时可得」</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">时间泄漏</text><text class="f-s" x="282.0" y="227.0">对时序数据随机划分</text><text class="f-s" x="492.0" y="227.0">用未来预测过去</text><text class="f-s" x="702.0" y="227.0">按时间切分，留隔离带</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">标签泄漏</text><text class="f-s" x="282.0" y="271.0">特征里含结果或结果代理</text><text class="f-s" x="492.0" y="271.0">等于直接抄答案</text><text class="f-s" x="702.0" y="271.0">看单特征 AUC 是否异常高</text><text class="f-s" x="60" y="316">泄漏的共同特征：离线分数漂亮，上线立刻掉一大截。</text>
</svg>
