<text class="f-h" x="40" y="28">同样 60 轮，双螺旋上的验证准确率</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 62 L100 300"/><rect x="170.2" y="132.0" width="119.60000000000001" height="168.0" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="230.0" y="124.0">80.0%</text><text class="f-sc" x="230.0" y="318">宽 64</text><rect x="430.2" y="90.84" width="119.60000000000001" height="209.16" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="490.0" y="82.84">99.6%</text><text class="f-sc" x="490.0" y="318">宽 256</text><rect x="690.2" y="90.0" width="119.60000000000001" height="210.0" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="750.0" y="82.0">100.0%</text><text class="f-sc" x="750.0" y="318">深 4×16</text><text class="f-s" x="100" y="344">深 4×16 用 881 个参数追平甚至超过 1,025 参数的浅层；数值为本机实测。</text>
