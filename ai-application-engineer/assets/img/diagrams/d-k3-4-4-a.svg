<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="脏数据不只「缺」和「怪」">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">脏数据不只「缺」和「怪」</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">问题</text><text class="f-t" x="282.0" y="98">表现</text><text class="f-t" x="492.0" y="98">对建模的影响</text><text class="f-t" x="702.0" y="98">常见处理</text><rect class="f-b3" x="60" y="112.0" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="135.8">重复</text><text class="f-s" x="282.0" y="135.8">同一条记录出现多次</text><text class="f-s" x="492.0" y="135.8">同一实体跨集，泄漏</text><text class="f-s" x="702.0" y="135.8">按主键去重，保留最新</text><rect class="f-b3" x="60" y="149.6" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="173.4">单位/量纲</text><text class="f-s" x="282.0" y="173.4">金额有元也有分</text><text class="f-s" x="492.0" y="173.4">数值差 100 倍</text><text class="f-s" x="702.0" y="173.4">统一单位后重算</text><rect class="f-b3" x="60" y="187.2" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="211.0">编码/拼写</text><text class="f-s" x="282.0" y="211.0">「男 / M / 1」</text><text class="f-s" x="492.0" y="211.0">同类被拆成多类</text><text class="f-s" x="702.0" y="211.0">建立映射表归一</text><rect class="f-b3" x="60" y="224.8" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="248.60000000000002">时间格式</text><text class="f-s" x="282.0" y="248.60000000000002">字符串与时间戳混用</text><text class="f-s" x="492.0" y="248.60000000000002">无法排序与切窗</text><text class="f-s" x="702.0" y="248.60000000000002">统一解析为时间类型</text><rect class="f-b3" x="60" y="262.4" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="286.2">文本脏值</text><text class="f-s" x="282.0" y="286.2">空格、全角、占位符</text><text class="f-s" x="492.0" y="286.2">类别爆炸</text><text class="f-s" x="702.0" y="286.2">清洗后重新编码</text><text class="f-s" x="60" y="328.0">清洗的目标不是「让数据好看」，而是让每一列的含义在整张表里唯一。</text>
</svg>
