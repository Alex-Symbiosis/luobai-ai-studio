<text class="f-h" x="40" y="28">同一实验，两种特征组合的末轮 MSE</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 62 L100 300"/><rect x="205.3" y="299.1369" width="179.4" height="0.8631" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="295.0" y="291.1369">0.411%</text><text class="f-sc" x="295.0" y="318">只用原始特征</text><rect x="595.3" y="300.0" width="179.4" height="0.0" rx="4" fill="#2f6fd0" opacity="0.9"/><text class="f-sc" x="685.0" y="292.0">0.0%</text><text class="f-sc" x="685.0" y="318">加 x1×x2</text><text class="f-s" x="100" y="344">0.411 → 0.0 的差距，就是这条交互项携带的信息量。数值为实测四舍五入。</text>
