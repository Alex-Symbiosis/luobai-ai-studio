<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="问题分类树：按维度切开再谈">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="30">问题分类树：按维度切开再谈</text><rect class="f-b2" x="330" y="48" width="300" height="58" rx="9"/><text class="f-tc" x="480.0" y="72.0">「销量下滑」</text><text class="f-sc" x="480.0" y="91.0">先按维度切开</text><path class="f-ar" d="M480 110 L143.25 150" marker-end="url(#ah)"/><text class="f-s" x="149.25" y="136" text-anchor="middle">看谁</text><rect class="f-b" x="40.0" y="152" width="206.5" height="92" rx="9"/><text class="f-tc" x="143.25" y="193.0">按对象切</text><text class="f-sc" x="143.25" y="212.0">客户、产品、区域</text><text class="f-sc" x="143.25" y="270">↓</text><path class="f-ar" d="M480 110 L367.75 150" marker-end="url(#ah)"/><text class="f-s" x="373.75" y="136" text-anchor="middle">看何时</text><rect class="f-b" x="264.5" y="152" width="206.5" height="92" rx="9"/><text class="f-tc" x="367.75" y="193.0">按时间切</text><text class="f-sc" x="367.75" y="212.0">同比、环比、拐点</text><text class="f-sc" x="367.75" y="270">↓</text><path class="f-ar" d="M480 110 L592.25 150" marker-end="url(#ah)"/><text class="f-s" x="598.25" y="136" text-anchor="middle">看怎么算</text><rect class="f-b" x="489.0" y="152" width="206.5" height="92" rx="9"/><text class="f-tc" x="592.25" y="193.0">按口径切</text><text class="f-sc" x="592.25" y="212.0">含税、渠道、退货</text><text class="f-sc" x="592.25" y="270">↓</text><path class="f-ar" d="M480 110 L816.75 150" marker-end="url(#ah)"/><text class="f-s" x="822.75" y="136" text-anchor="middle">看哪一步</text><rect class="f-b" x="713.5" y="152" width="206.5" height="92" rx="9"/><text class="f-tc" x="816.75" y="193.0">按过程切</text><text class="f-sc" x="816.75" y="212.0">获客、转化、履约</text><text class="f-sc" x="816.75" y="270">↓</text><text class="f-s" x="40" y="316">切开的每一格都要能单独取数；格子里取不到数，说明维度还没切对。</text>
</svg>
