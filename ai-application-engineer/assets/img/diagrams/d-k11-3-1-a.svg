<text class="f-h" x="60" y="42">一条训练样本至少要有这四个字段</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">字段</text><text class="f-t" x="282.0" y="98">含义</text><text class="f-t" x="492.0" y="98">示例</text><text class="f-t" x="702.0" y="98">缺失后果</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">text</text><text class="f-s" x="282.0" y="139.0">原始文本</text><text class="f-s" x="492.0" y="139.0">「恭喜您中奖…」</text><text class="f-s" x="702.0" y="139.0">无法复现输入</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">label</text><text class="f-s" x="282.0" y="183.0">类别标签</text><text class="f-s" x="492.0" y="183.0">spam / ham</text><text class="f-s" x="702.0" y="183.0">学不到目标</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">split</text><text class="f-s" x="282.0" y="227.0">训练 / 测试</text><text class="f-s" x="492.0" y="227.0">train / test</text><text class="f-s" x="702.0" y="227.0">评估被污染</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">note</text><text class="f-s" x="282.0" y="271.0">边界说明</text><text class="f-s" x="492.0" y="271.0">含短链算广告</text><text class="f-s" x="702.0" y="271.0">口径漂移</text><text class="f-s" x="60" y="316">标签定义不清，模型学不准；字段不全，连错在哪都查不出来。</text>
</svg>
