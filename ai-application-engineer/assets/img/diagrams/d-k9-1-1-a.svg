<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="语言分四层，每层都有各自的典型任务">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">语言分四层，每层都有各自的典型任务</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">层级</text><text class="f-t" x="282.0" y="98">处理对象</text><text class="f-t" x="492.0" y="98">典型任务</text><text class="f-t" x="702.0" y="98">这一层错了会怎样</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">词法</text><text class="f-s" x="282.0" y="139.0">字与词</text><text class="f-s" x="492.0" y="139.0">分词、词性、命名实体</text><text class="f-s" x="702.0" y="139.0">词切错，上层全错</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">句法</text><text class="f-s" x="282.0" y="183.0">短语与句子</text><text class="f-s" x="492.0" y="183.0">依存、成分、语法树</text><text class="f-s" x="702.0" y="183.0">结构错，角色跟着错</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">语义</text><text class="f-s" x="282.0" y="227.0">词义与句义</text><text class="f-s" x="492.0" y="227.0">词义消歧、语义角色</text><text class="f-s" x="702.0" y="227.0">字面懂，意思不懂</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">语用</text><text class="f-s" x="282.0" y="271.0">语境与意图</text><text class="f-s" x="492.0" y="271.0">指代、会话含义、对话</text><text class="f-s" x="702.0" y="271.0">话听懂，用意听错</text><text class="f-s" x="60" y="316">四层是包含关系不是并列：上层任务一律拿下层的结果当输入。</text>
</svg>
