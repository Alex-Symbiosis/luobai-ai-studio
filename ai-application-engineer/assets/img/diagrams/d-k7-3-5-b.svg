<text class="f-h" x="40" y="28">阈值升高：精确率升、召回率降、F1 先升后降</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M110 250 L240 226 L380 196 L520 162 L660 126 L800 102 L880 92" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">精确率</text><path d="M110 100 L240 126 L380 162 L520 206 L660 254 L800 288 L880 294" fill="none" stroke="#d98b3a" stroke-width="2.4"/><line x1="700" y1="90" x2="726" y2="90" stroke="#d98b3a" stroke-width="2.6"/><text class="f-s" x="734" y="94">召回率</text><path d="M110 172 L240 164 L380 156 L520 170 L660 196 L800 218 L880 230" fill="none" stroke="#3f9b78" stroke-width="2.4"/><line x1="700" y1="110" x2="726" y2="110" stroke="#3f9b78" stroke-width="2.6"/><text class="f-s" x="734" y="114">F1</text><circle class="f-pt" cx="380" cy="156" r="6"/><text class="f-s" x="390" y="148">F1 峰值</text><text class="f-s" x="880" y="322" text-anchor="end">判定阈值 →</text><text class="f-s" x="92" y="66" text-anchor="end">指标值</text><text class="f-s" x="100" y="340">阈值越高越保守；F1 的峰值只是参考，最终按业务代价选点。</text>
