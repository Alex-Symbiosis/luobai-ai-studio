.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="40" y="28">阈值一动，误报和漏报此消彼长</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M110 272 L240 240 L380 205 L520 170 L660 132 L800 102 L880 92" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">误报率</text><path d="M110 92 L240 118 L380 148 L520 176 L660 215 L800 258 L880 272" fill="none" stroke="#d98b3a" stroke-width="2.4"/><line x1="700" y1="90" x2="726" y2="90" stroke="#d98b3a" stroke-width="2.6"/><text class="f-s" x="734" y="94">漏报率</text><circle class="f-pt" cx="505" cy="173" r="6"/><text class="f-s" x="515" y="165">折中点</text><text class="f-s" x="880" y="322" text-anchor="end">告警阈值 →</text><text class="f-s" x="92" y="66" text-anchor="end">错误率</text><text class="f-s" x="100" y="340">误报多了，保安会直接关掉告警；那时的漏报代价比误报更大。</text>
