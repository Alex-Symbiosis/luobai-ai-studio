<text class="f-h" x="60" y="42">5 折交叉验证：每折都当一次验证集</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">轮次</text><text class="f-t" x="282.0" y="98">训练集</text><text class="f-t" x="492.0" y="98">验证集</text><text class="f-t" x="702.0" y="98">记录</text><rect class="f-b3" x="60" y="112.0" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="135.8">第 1 折</text><text class="f-s" x="282.0" y="135.8">第 2–5 份</text><text class="f-s" x="492.0" y="135.8">第 1 份</text><text class="f-s" x="702.0" y="135.8">score 1</text><rect class="f-b3" x="60" y="149.6" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="173.4">第 2 折</text><text class="f-s" x="282.0" y="173.4">第 1、3–5 份</text><text class="f-s" x="492.0" y="173.4">第 2 份</text><text class="f-s" x="702.0" y="173.4">score 2</text><rect class="f-b3" x="60" y="187.2" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="211.0">第 3 折</text><text class="f-s" x="282.0" y="211.0">第 1、2、4、5 份</text><text class="f-s" x="492.0" y="211.0">第 3 份</text><text class="f-s" x="702.0" y="211.0">score 3</text><rect class="f-b3" x="60" y="224.8" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="248.60000000000002">第 4 折</text><text class="f-s" x="282.0" y="248.60000000000002">第 1–3、5 份</text><text class="f-s" x="492.0" y="248.60000000000002">第 4 份</text><text class="f-s" x="702.0" y="248.60000000000002">score 4</text><rect class="f-b3" x="60" y="262.4" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="286.2">第 5 折</text><text class="f-s" x="282.0" y="286.2">第 1–4 份</text><text class="f-s" x="492.0" y="286.2">第 5 份</text><text class="f-s" x="702.0" y="286.2">score 5</text><text class="f-s" x="60" y="328.0">最终报告的是 5 个分数的均值与标准差；分类任务应使用分层 K 折，保持每折类别比例。</text>
