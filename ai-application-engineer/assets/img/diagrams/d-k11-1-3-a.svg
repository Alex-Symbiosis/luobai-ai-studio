<text class="f-h" x="40" y="30">重构顺序：先分步骤，再分状态，最后分职责</text><rect class="f-b2" x="120" y="54" width="720" height="56" rx="8"/><text class="f-t" x="146" y="87.0">脚本 main.py</text><text class="f-s" x="430" y="87.0">一次性的流程：从上跑到下</text><rect class="f-b" x="120" y="118" width="720" height="56" rx="8"/><text class="f-t" x="146" y="151.0">函数</text><text class="f-s" x="430" y="151.0">封装步骤：输入明确、输出明确</text><rect class="f-b" x="120" y="182" width="720" height="56" rx="8"/><text class="f-t" x="146" y="215.0">类</text><text class="f-s" x="430" y="215.0">封装状态：数据与操作绑在一起</text><rect class="f-b" x="120" y="246" width="720" height="56" rx="8"/><text class="f-t" x="146" y="279.0">模块 / 包</text><text class="f-s" x="430" y="279.0">封装职责：可导入、可测试、可复用</text><text class="f-s" x="120" y="336">每上一层只解决一件事；跳级重构，往往只是把混乱挪了个位置。</text>
