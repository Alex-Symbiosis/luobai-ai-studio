<text class="f-h" x="60" y="42">三条路线：差异来自产业基础与治理传统</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">经济体</text><text class="f-t" x="352.0" y="98">路线</text><text class="f-t" x="632.0" y="98">代表文件（年份）</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">英国</text><text class="f-s" x="352.0" y="139.0">监管与伦理先行</text><text class="f-s" x="632.0" y="139.0">国家 AI 战略（2021-09）</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">日本</text><text class="f-s" x="352.0" y="183.0">社会问题导向</text><text class="f-s" x="632.0" y="183.0">AI 戦略 2022（2022-04）</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">欧盟</text><text class="f-s" x="352.0" y="227.0">规则与可信 AI</text><text class="f-s" x="632.0" y="227.0">AI 法案（2024-08 生效）</text><text class="f-s" x="60" y="272">同一技术，不同治理传统会长出不同的政策组合；比较时先看约束，不看口号。</text>
