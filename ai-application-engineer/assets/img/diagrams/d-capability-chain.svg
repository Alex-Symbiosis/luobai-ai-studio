<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="智能的六个能力环节串成闭环">
  <defs>
    <marker id="d1ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9cc0ff"/>
    </marker>
  </defs>
  <style>
    .d1-bx{fill:#ffffff;stroke:#cfe0ff;stroke-width:1.5}
    .d1-bx-hi{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.5}
    .d1-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;font-weight:600;fill:#123a78;text-anchor:middle}
    .d1-c{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.5px;fill:#5a6b80;text-anchor:middle}
    .d1-note{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#5a6b80}
    .d1-fb{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.5px;fill:#1f5fd0;text-anchor:middle}
    .d1-ln{stroke:#9cc0ff;stroke-width:1.5;marker-end:url(#d1ar)}
    .d1-fbl{stroke:#9cc0ff;stroke-width:1.3;stroke-dasharray:5 5;fill:none}
  </style>

  <text class="d1-note" x="20" y="34">智能不是某一项技能，而是六个环节首尾相接的一条链路</text>

  <rect class="d1-bx-hi" x="20" y="60" width="120" height="72" rx="12"/>
  <text class="d1-t" x="80" y="94">感知</text>
  <text class="d1-c" x="80" y="115">看见 / 听见 / 读到</text>

  <rect class="d1-bx" x="180" y="60" width="120" height="72" rx="12"/>
  <text class="d1-t" x="240" y="94">表示</text>
  <text class="d1-c" x="240" y="115">把世界变成结构</text>

  <rect class="d1-bx" x="340" y="60" width="120" height="72" rx="12"/>
  <text class="d1-t" x="400" y="94">推理</text>
  <text class="d1-c" x="400" y="115">由已知推未知</text>

  <rect class="d1-bx" x="500" y="60" width="120" height="72" rx="12"/>
  <text class="d1-t" x="560" y="94">学习</text>
  <text class="d1-c" x="560" y="115">用数据改规则</text>

  <rect class="d1-bx" x="660" y="60" width="120" height="72" rx="12"/>
  <text class="d1-t" x="720" y="94">决策</text>
  <text class="d1-c" x="720" y="115">在选项里取舍</text>

  <rect class="d1-bx" x="820" y="60" width="120" height="72" rx="12"/>
  <text class="d1-t" x="880" y="94">行动</text>
  <text class="d1-c" x="880" y="115">作用于环境</text>

  <line class="d1-ln" x1="142" y1="96" x2="176" y2="96"/>
  <line class="d1-ln" x1="302" y1="96" x2="336" y2="96"/>
  <line class="d1-ln" x1="462" y1="96" x2="496" y2="96"/>
  <line class="d1-ln" x1="622" y1="96" x2="656" y2="96"/>
  <line class="d1-ln" x1="782" y1="96" x2="816" y2="96"/>

  <path class="d1-fbl" d="M880,140 L880,208 L80,208 L80,142"/>
  <path d="M80,142 l-5,9 l10,0 z" fill="#9cc0ff"/>
  <text class="d1-fb" x="480" y="230">反馈：行动的结果，成为下一轮感知与学习的输入</text>
</svg>
