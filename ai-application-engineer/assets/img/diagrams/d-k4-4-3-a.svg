<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="学习曲线的三种诊断">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">学习曲线的三种诊断</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">状态</text><text class="f-t" x="240.0" y="98">训练误差</text><text class="f-t" x="408.0" y="98">验证误差</text><text class="f-t" x="576.0" y="98">两条线的关系</text><text class="f-t" x="744.0" y="98">下一步</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">高偏差</text><text class="f-s" x="240.0" y="139.0">高</text><text class="f-s" x="408.0" y="139.0">高</text><text class="f-s" x="576.0" y="139.0">都很高且贴得近</text><text class="f-s" x="744.0" y="139.0">加特征 / 升容量</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">高方差</text><text class="f-s" x="240.0" y="183.0">低</text><text class="f-s" x="408.0" y="183.0">高</text><text class="f-s" x="576.0" y="183.0">裂口大</text><text class="f-s" x="744.0" y="183.0">加数据 / 加正则</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">合适</text><text class="f-s" x="240.0" y="227.0">低</text><text class="f-s" x="408.0" y="227.0">低</text><text class="f-s" x="576.0" y="227.0">都低且间距小</text><text class="f-s" x="744.0" y="227.0">进入评估</text><text class="f-s" x="60" y="272">先看两条线的间距，再看它们随样本量的走势；只看一个分数无法判断是哪一类问题。</text>
</svg>
