<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="朴素假设与平滑">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">朴素假设与平滑</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">问题</text><text class="f-t" x="282.0" y="98">朴素做法</text><text class="f-t" x="492.0" y="98">代价</text><text class="f-t" x="702.0" y="98">补救</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">词之间强相关</text><text class="f-s" x="282.0" y="139.0">假设条件独立</text><text class="f-s" x="492.0" y="139.0">概率被高估或低估</text><text class="f-s" x="702.0" y="139.0">特征选择、去冗余</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">某词未出现</text><text class="f-s" x="282.0" y="183.0">概率为 0，连乘归零</text><text class="f-s" x="492.0" y="183.0">整封邮件被判 0</text><text class="f-s" x="702.0" y="183.0">拉普拉斯平滑</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">样本很少</text><text class="f-s" x="282.0" y="227.0">估计不稳</text><text class="f-s" x="492.0" y="227.0">方差大</text><text class="f-s" x="702.0" y="227.0">增大平滑系数 α</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">类别极不平衡</text><text class="f-s" x="282.0" y="271.0">先验一边倒</text><text class="f-s" x="492.0" y="271.0">少数类被忽略</text><text class="f-s" x="702.0" y="271.0">调先验或重采样</text><text class="f-s" x="60" y="316">假设不真但常常够用；平滑不是修饰，而是让连乘不塌掉的必要兜底。</text>
</svg>
