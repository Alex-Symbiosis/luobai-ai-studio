<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="三类机器人，闭环的节点相同、频率不同">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">三类机器人，闭环的节点相同、频率不同</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">类型</text><text class="f-t" x="282.0" y="98">感知什么</text><text class="f-t" x="492.0" y="98">怎么决策</text><text class="f-t" x="702.0" y="98">执行什么</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">工业机械臂</text><text class="f-s" x="282.0" y="139.0">位置、力矩、视觉</text><text class="f-s" x="492.0" y="139.0">示教轨迹或规划</text><text class="f-s" x="702.0" y="139.0">关节伺服</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">移动机器人</text><text class="f-s" x="282.0" y="183.0">激光雷达、里程计、相机</text><text class="f-s" x="492.0" y="183.0">定位、建图、路径规划</text><text class="f-s" x="702.0" y="183.0">轮速与转向</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">服务机器人</text><text class="f-s" x="282.0" y="227.0">视觉、语音、触觉</text><text class="f-s" x="492.0" y="227.0">规则与模型混合</text><text class="f-s" x="702.0" y="227.0">交互与移动</text><text class="f-s" x="60" y="272">闭环频率从几十赫兹到几赫兹不等；感知、决策、执行缺一环，机器人就动不了。</text>
</svg>
