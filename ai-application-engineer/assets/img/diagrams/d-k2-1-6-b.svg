<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="六类传感器，输出的是不同形态的信号">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">六类传感器，输出的是不同形态的信号</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">传感器</text><text class="f-t" x="352.0" y="98">感知什么</text><text class="f-t" x="632.0" y="98">输出信号</text><rect class="f-b3" x="60" y="112.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="132.66666666666669">图像</text><text class="f-s" x="352.0" y="132.66666666666669">光照与纹理</text><text class="f-s" x="632.0" y="132.66666666666669">像素阵列（数字）</text><rect class="f-b3" x="60" y="143.33333333333334" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="164.0">声音</text><text class="f-s" x="352.0" y="164.0">声压变化</text><text class="f-s" x="632.0" y="164.0">模拟电压 → 数字采样</text><rect class="f-b3" x="60" y="174.66666666666666" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="195.33333333333331">温湿度</text><text class="f-s" x="352.0" y="195.33333333333331">温度、相对湿度</text><text class="f-s" x="632.0" y="195.33333333333331">电阻或电容变化 → 数字</text><rect class="f-b3" x="60" y="206.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="226.66666666666666">惯性</text><text class="f-s" x="352.0" y="226.66666666666666">加速度、角速度</text><text class="f-s" x="632.0" y="226.66666666666666">MEMS 电压 → 数字</text><rect class="f-b3" x="60" y="237.33333333333331" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="258.0">距离</text><text class="f-s" x="352.0" y="258.0">超声波、红外、激光</text><text class="f-s" x="632.0" y="258.0">时间差或相位 → 距离</text><rect class="f-b3" x="60" y="268.66666666666663" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="289.3333333333333">生物</text><text class="f-s" x="352.0" y="289.3333333333333">心率、血氧、皮电</text><text class="f-s" x="632.0" y="289.3333333333333">光电容积或电极信号</text><text class="f-s" x="60" y="328.0">信号形态不同，进模型前都要先统一成数字与量纲。</text>
</svg>
