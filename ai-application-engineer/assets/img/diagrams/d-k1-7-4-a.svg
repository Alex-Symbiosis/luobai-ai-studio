<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="四种路线 × 三问：不问优劣，先问约束">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">四种路线 × 三问：不问优劣，先问约束</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">路线</text><text class="f-t" x="282.0" y="98">谁定方向</text><text class="f-t" x="492.0" y="98">谁承担风险</text><text class="f-t" x="702.0" y="98">评价标准</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">市场驱动</text><text class="f-s" x="282.0" y="139.0">企业与资本</text><text class="f-s" x="492.0" y="139.0">企业与投资人</text><text class="f-s" x="702.0" y="139.0">市场份额与利润</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">监管先行</text><text class="f-s" x="282.0" y="183.0">监管机构</text><text class="f-s" x="492.0" y="183.0">政府与社会</text><text class="f-s" x="702.0" y="183.0">合规与公众信任</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">社会问题导向</text><text class="f-s" x="282.0" y="227.0">政府与行业联合</text><text class="f-s" x="492.0" y="227.0">财政与社会</text><text class="f-s" x="702.0" y="227.0">问题解决程度</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">规划牵引</text><text class="f-s" x="282.0" y="271.0">中央政府</text><text class="f-s" x="492.0" y="271.0">政府与国企</text><text class="f-s" x="702.0" y="271.0">规划目标完成度</text><text class="f-s" x="60" y="316">路线没有天然优劣；换一套约束条件，最优解就会变。</text>
</svg>
