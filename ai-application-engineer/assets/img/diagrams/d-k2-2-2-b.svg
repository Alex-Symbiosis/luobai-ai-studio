<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="60" y="26">同一件事：由谁决定「看什么」</text><rect class="f-b" x="60" y="44" width="390" height="286" rx="12"/><text class="f-t" x="80" y="76">手工特征工程</text><text class="f-s" x="80" y="108">· 人来决定看什么</text><text class="f-s" x="80" y="138">· 边缘、纹理、词频</text><text class="f-s" x="80" y="168">· 依赖领域经验</text><text class="f-s" x="80" y="198">· 换场景要重新设计</text><text class="f-s" x="80" y="228">· 特征可解释</text><rect class="f-green" x="510" y="44" width="390" height="286" rx="12"/><text class="f-t" x="530" y="76">端到端表示学习</text><text class="f-s" x="530" y="108">· 模型自己学表示</text><text class="f-s" x="530" y="138">· 多层堆叠逐级抽象</text><text class="f-s" x="530" y="168">· 依赖数据与算力</text><text class="f-s" x="530" y="198">· 换场景可微调</text><text class="f-s" x="530" y="228">· 中间层难解释</text><path class="f-dash" d="M470 60 L470 316"/>
</svg>
