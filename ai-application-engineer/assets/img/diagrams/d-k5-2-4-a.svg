<text class="f-h" x="40" y="28">Sigmoid 与 0.5 阈值</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M120 288 L200 284 L280 274 L360 250 L440 208 L520 160 L600 116 L680 92 L760 82 L840 78" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">σ(z)</text><path d="M120 180 L840 180" fill="none" stroke="#9db9d8" stroke-width="2.4"/><line x1="700" y1="90" x2="726" y2="90" stroke="#9db9d8" stroke-width="2.6"/><text class="f-s" x="734" y="94">阈值 0.5</text><text class="f-s" x="760" y="170">p = 0.5</text><text class="f-s" x="880" y="322" text-anchor="end">z</text><text class="f-s" x="92" y="66" text-anchor="end">p</text><text class="f-s" x="100" y="340">z = 0 时 p = 0.5；权重方向决定边界朝向，阈值决定边界平移。</text>
