</style>
<text class="f-h" x="40" y="28">异常检测：先学「正常长什么样」</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M110 232 L170 214 L230 205 L290 197 L350 190 L410 184 L470 182 L530 186 L590 192 L650 200 L710 212 L770 228 L830 244" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><circle class="f-pt" cx="250" cy="110" r="6"/><text class="f-s" x="260" y="102">尖峰异常</text><circle class="f-pt" cx="690" cy="300" r="6"/><text class="f-s" x="700" y="292">低值异常</text><text class="f-s" x="300" y="88">正常区间：模型学到的分布</text><path class="f-dash" d="M200 120 L260 120"/><path class="f-dash" d="M740 120 L260 120"/><text class="f-s" x="880" y="322" text-anchor="end">时间</text><text class="f-s" x="92" y="66" text-anchor="end">指标值</text><text class="f-s" x="100" y="340">阈值定得松，误报多；定得紧，漏报多。阈值本身就是业务决策。</text>
