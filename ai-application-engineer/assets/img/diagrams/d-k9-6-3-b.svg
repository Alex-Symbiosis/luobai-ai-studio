<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="十组词里，两种方法有三组排位不同">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">十组词里，两种方法有三组排位不同</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">词对</text><text class="f-t" x="282.0" y="98">路径名次</text><text class="f-t" x="492.0" y="98">余弦名次</text><text class="f-t" x="702.0" y="98">是否相差 3 位以上</text><rect class="f-b3" x="60" y="112.0" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="126.4">狗—狼</text><text class="f-s" x="282.0" y="126.4">1</text><text class="f-s" x="492.0" y="126.4">5</text><text class="f-s" x="702.0" y="126.4">是</text><rect class="f-b3" x="60" y="130.8" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="145.20000000000002">猫—虎</text><text class="f-s" x="282.0" y="145.20000000000002">2</text><text class="f-s" x="492.0" y="145.20000000000002">6</text><text class="f-s" x="702.0" y="145.20000000000002">是</text><rect class="f-b3" x="60" y="149.6" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="164.0">玫瑰—菊花</text><text class="f-s" x="282.0" y="164.0">3</text><text class="f-s" x="492.0" y="164.0">2</text><text class="f-s" x="702.0" y="164.0">否</text><rect class="f-b3" x="60" y="168.4" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="182.8">狗—猫</text><text class="f-s" x="282.0" y="182.8">4</text><text class="f-s" x="492.0" y="182.8">1</text><text class="f-s" x="702.0" y="182.8">是</text><rect class="f-b3" x="60" y="187.2" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="201.6">汽车—自行车</text><text class="f-s" x="282.0" y="201.6">5</text><text class="f-s" x="492.0" y="201.6">3</text><text class="f-s" x="702.0" y="201.6">否</text><rect class="f-b3" x="60" y="206.0" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="220.4">汽车—飞机</text><text class="f-s" x="282.0" y="220.4">6</text><text class="f-s" x="492.0" y="220.4">4</text><text class="f-s" x="702.0" y="220.4">否</text><rect class="f-b3" x="60" y="224.8" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="239.20000000000002">玫瑰—树</text><text class="f-s" x="282.0" y="239.20000000000002">7</text><text class="f-s" x="492.0" y="239.20000000000002">7</text><text class="f-s" x="702.0" y="239.20000000000002">否</text><rect class="f-b3" x="60" y="243.6" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="258.0">麻雀—猫</text><text class="f-s" x="282.0" y="258.0">8</text><text class="f-s" x="492.0" y="258.0">8</text><text class="f-s" x="702.0" y="258.0">否</text><rect class="f-b3" x="60" y="262.4" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="276.79999999999995">狗—玫瑰</text><text class="f-s" x="282.0" y="276.79999999999995">9</text><text class="f-s" x="492.0" y="276.79999999999995">9</text><text class="f-s" x="702.0" y="276.79999999999995">否</text><rect class="f-b3" x="60" y="281.20000000000005" width="840" height="18.8" rx="0"/><text class="f-s" x="72.0" y="295.6">猫—汽车</text><text class="f-s" x="282.0" y="295.6">10</text><text class="f-s" x="492.0" y="295.6">10</text><text class="f-s" x="702.0" y="295.6">否</text><text class="f-s" x="60" y="328.0">路径看结构，共现看用法；结构近而用法远，两种排序就会打架。</text>
</svg>
