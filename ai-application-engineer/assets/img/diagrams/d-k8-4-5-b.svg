<text class="f-h" x="40" y="28">趋势在涨，季节在起伏</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M110 250 L178 268 L246 230 L314 238 L382 210 L450 224 L518 196 L586 208 L654 186 L722 200 L790 140 L858 176" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">月度销量</text><path d="M110 244 L246 232 L382 218 L518 204 L654 190 L790 176 L858 164" fill="none" stroke="#d98b3a" stroke-width="2.4"/><line x1="700" y1="90" x2="726" y2="90" stroke="#d98b3a" stroke-width="2.6"/><text class="f-s" x="734" y="94">趋势线</text><circle class="f-pt" cx="790" cy="140" r="6"/><text class="f-s" x="800" y="132">尖峰：先查大促</text><circle class="f-pt" cx="178" cy="268" r="6"/><text class="f-s" x="188" y="260">春节回落</text><text class="f-s" x="880" y="322" text-anchor="end">月份 →</text><text class="f-s" x="92" y="66" text-anchor="end">销量</text><text class="f-s" x="100" y="340">剥掉趋势与季节再看那个尖峰，才谈得上「异常」。</text>
