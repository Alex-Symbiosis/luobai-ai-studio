<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="技术地图：先问标签，再问任务">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="30">技术地图：先问标签，再问任务</text><rect class="f-b2" x="390" y="42" width="180" height="54" rx="9"/><text class="f-tc" x="480" y="66">输入数据</text><text class="f-sc" x="480" y="84">先问：有没有标签</text><path class="f-ar" d="M440 96 L310 128" marker-end="url(#ah)"/><path class="f-ar" d="M520 96 L650 128" marker-end="url(#ah)"/><rect class="f-b" x="150" y="130" width="300" height="56" rx="9"/><text class="f-tc" x="300.0" y="154">有标签</text><text class="f-sc" x="300.0" y="172">答案已知，学映射</text><path class="f-ar" d="M260 188 L180.0 222" marker-end="url(#ah)"/><rect class="f-b3" x="80" y="226" width="200" height="56" rx="9"/><text class="f-tc" x="180.0" y="250">分类</text><text class="f-sc" x="180.0" y="268">离散标签</text><path class="f-ar" d="M340 188 L420.0 222" marker-end="url(#ah)"/><rect class="f-b3" x="320" y="226" width="200" height="56" rx="9"/><text class="f-tc" x="420.0" y="250">回归</text><text class="f-sc" x="420.0" y="268">连续数值</text><rect class="f-b" x="510" y="130" width="300" height="56" rx="9"/><text class="f-tc" x="660.0" y="154">无标签</text><text class="f-sc" x="660.0" y="172">只看到输入</text><path class="f-ar" d="M540 188 L595.0 222" marker-end="url(#ah)"/><rect class="f-b3" x="540" y="226" width="110" height="56" rx="9"/><text class="f-tc" x="595.0" y="250">聚类</text><text class="f-sc" x="595.0" y="268">找相似</text><path class="f-ar" d="M600 188 L715.0 222" marker-end="url(#ah)"/><rect class="f-b3" x="660" y="226" width="110" height="56" rx="9"/><text class="f-tc" x="715.0" y="250">关联</text><text class="f-sc" x="715.0" y="268">找共现</text><path class="f-ar" d="M660 188 L835.0 222" marker-end="url(#ah)"/><rect class="f-b3" x="780" y="226" width="110" height="56" rx="9"/><text class="f-tc" x="835.0" y="250">偏差</text><text class="f-sc" x="835.0" y="268">找偏离</text><text class="f-s" x="40" y="330">非表格输入（文本、网页）仍走这两条线，换的是算法，不是判定顺序。</text>
</svg>
