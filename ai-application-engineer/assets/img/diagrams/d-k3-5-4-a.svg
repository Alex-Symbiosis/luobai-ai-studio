<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="特征只能在「当时」取到">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="28">特征只能在「当时」取到</text><path class="f-ar" d="M60 200 L900 200" marker-end="url(#ah)"/><circle class="f-dot" cx="90.0" cy="200" r="5"/><path class="f-ax" d="M90.0 195 L90.0 160"/><text class="f-t" x="90.0" y="146" text-anchor="middle">已知</text><text class="f-s" x="90.0" y="130" text-anchor="middle">用户、商品、时间</text><text class="f-s" x="90.0" y="220" text-anchor="middle">下单</text><circle class="f-dot" cx="292.5" cy="200" r="5"/><path class="f-ax" d="M292.5 205 L292.5 240"/><text class="f-t" x="292.5" y="258" text-anchor="middle">已知</text><text class="f-s" x="292.5" y="274" text-anchor="middle">支付方式、优惠</text><text class="f-s" x="292.5" y="194" text-anchor="middle">支付</text><circle class="f-dot" cx="495.0" cy="200" r="5"/><path class="f-ax" d="M495.0 195 L495.0 160"/><text class="f-t" x="495.0" y="146" text-anchor="middle">可用</text><text class="f-s" x="495.0" y="130" text-anchor="middle">仓库、物流商</text><text class="f-s" x="495.0" y="220" text-anchor="middle">发货</text><circle class="f-dot" cx="697.5" cy="200" r="5"/><path class="f-ax" d="M697.5 205 L697.5 240"/><text class="f-t" x="697.5" y="258" text-anchor="middle">不可用</text><text class="f-s" x="697.5" y="274" text-anchor="middle">签收时长是结果</text><text class="f-s" x="697.5" y="194" text-anchor="middle">签收</text><circle class="f-dot" cx="900.0" cy="200" r="5"/><path class="f-ax" d="M900.0 195 L900.0 160"/><text class="f-t" x="900.0" y="146" text-anchor="middle">不可用</text><text class="f-s" x="900.0" y="130" text-anchor="middle">退货是未来标签</text><text class="f-s" x="900.0" y="220" text-anchor="middle">退货</text><text class="f-s" x="60" y="330">判断一个特征能不能用，只问一句：在预测那一刻，这个值真的已经产生了吗？</text>
</svg>
