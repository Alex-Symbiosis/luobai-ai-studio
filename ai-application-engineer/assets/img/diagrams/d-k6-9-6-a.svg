<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="五个网络，五条设计主线">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">五个网络，五条设计主线</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">网络</text><text class="f-t" x="282.0" y="98">年份</text><text class="f-t" x="492.0" y="98">关键设计</text><text class="f-t" x="702.0" y="98">参数量级</text><rect class="f-b3" x="60" y="112.0" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="135.8">LeNet-5</text><text class="f-s" x="282.0" y="135.8">1998</text><text class="f-s" x="492.0" y="135.8">卷积 + 池化 + 全连接</text><text class="f-s" x="702.0" y="135.8">约 6 万</text><rect class="f-b3" x="60" y="149.6" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="173.4">AlexNet</text><text class="f-s" x="282.0" y="173.4">2012</text><text class="f-s" x="492.0" y="173.4">ReLU、Dropout、双 GPU</text><text class="f-s" x="702.0" y="173.4">约 6,000 万</text><rect class="f-b3" x="60" y="187.2" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="211.0">VGG-16</text><text class="f-s" x="282.0" y="211.0">2014</text><text class="f-s" x="492.0" y="211.0">全 3×3 堆叠，结构规整</text><text class="f-s" x="702.0" y="211.0">约 1.38 亿</text><rect class="f-b3" x="60" y="224.8" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="248.60000000000002">Inception-v3</text><text class="f-s" x="282.0" y="248.60000000000002">2015</text><text class="f-s" x="492.0" y="248.60000000000002">多分支并联 + 卷积分解</text><text class="f-s" x="702.0" y="248.60000000000002">约 2,400 万</text><rect class="f-b3" x="60" y="262.4" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="286.2">ResNet-50</text><text class="f-s" x="282.0" y="286.2">2015</text><text class="f-s" x="492.0" y="286.2">残差短路，超深可训</text><text class="f-s" x="702.0" y="286.2">约 2,560 万</text><text class="f-s" x="60" y="328.0">主线从「更深」走向「更高效」：同样精度下参数与计算量持续下降。</text>
</svg>
