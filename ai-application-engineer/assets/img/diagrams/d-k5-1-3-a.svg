<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="12 种算法地图">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">12 种算法地图</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">任务</text><text class="f-t" x="282.0" y="98">代表算法</text><text class="f-t" x="492.0" y="98">可解释性</text><text class="f-t" x="702.0" y="98">典型数据规模</text><rect class="f-b3" x="60" y="112.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="132.66666666666669">回归</text><text class="f-s" x="282.0" y="132.66666666666669">线性回归、回归树</text><text class="f-s" x="492.0" y="132.66666666666669">高 / 中</text><text class="f-s" x="702.0" y="132.66666666666669">小到中</text><rect class="f-b3" x="60" y="143.33333333333334" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="164.0">分类</text><text class="f-s" x="282.0" y="164.0">逻辑回归、SVM、KNN</text><text class="f-s" x="492.0" y="164.0">高 / 中 / 中</text><text class="f-s" x="702.0" y="164.0">小到中</text><rect class="f-b3" x="60" y="174.66666666666666" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="195.33333333333331">分类</text><text class="f-s" x="282.0" y="195.33333333333331">决策树、随机森林</text><text class="f-s" x="492.0" y="195.33333333333331">高 / 低</text><text class="f-s" x="702.0" y="195.33333333333331">中</text><rect class="f-b3" x="60" y="206.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="226.66666666666666">分类</text><text class="f-s" x="282.0" y="226.66666666666666">朴素贝叶斯、AdaBoost</text><text class="f-s" x="492.0" y="226.66666666666666">中 / 低</text><text class="f-s" x="702.0" y="226.66666666666666">中到高</text><rect class="f-b3" x="60" y="237.33333333333331" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="258.0">聚类</text><text class="f-s" x="282.0" y="258.0">K-Means、DBSCAN</text><text class="f-s" x="492.0" y="258.0">中 / 中</text><text class="f-s" x="702.0" y="258.0">中到高</text><rect class="f-b3" x="60" y="268.66666666666663" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="289.3333333333333">降维</text><text class="f-s" x="282.0" y="289.3333333333333">LDA、PCA</text><text class="f-s" x="492.0" y="289.3333333333333">高 / 中</text><text class="f-s" x="702.0" y="289.3333333333333">中</text><text class="f-s" x="60" y="328.0">先按任务定位纵轴，再按可解释性与数据规模收窄候选。</text>
</svg>
