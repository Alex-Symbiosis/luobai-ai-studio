<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Apriori：一层一层筛，越筛越少">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="28">Apriori：一层一层筛，越筛越少</text><text class="f-s" x="40" y="52">示例数据：12 条交易，最小支持度 0.25；频繁项集共 6 个（4 + 2）</text><rect class="f-b" x="60" y="80" width="240" height="180" rx="10"/><text class="f-tc" x="180" y="112">1-项集：4 个</text><text class="f-sc" x="180" y="152">尿布、啤酒、牛奶、面包</text><text class="f-sc" x="180" y="180">支撑度都不低于 0.25</text><text class="f-sc" x="180" y="208">共 4 个频繁单项</text><path class="f-ar" d="M304 170 L356 170" marker-end="url(#ah)"/><rect class="f-b" x="360" y="80" width="240" height="180" rx="10"/><text class="f-tc" x="480" y="112">2-项集：2 个</text><text class="f-sc" x="480" y="152">{尿布, 啤酒} 0.50</text><text class="f-sc" x="480" y="180">{牛奶, 面包} 0.25</text><text class="f-sc" x="480" y="208">由频繁单项两两组合</text><path class="f-ar" d="M604 170 L656 170" marker-end="url(#ah)"/><rect class="f-b2" x="660" y="80" width="240" height="180" rx="10"/><text class="f-tc" x="780" y="112">规则：按置信度筛</text><text class="f-sc" x="780" y="152">≥ 0.50 → 4 条</text><text class="f-sc" x="780" y="180">≥ 0.80 → 2 条</text><text class="f-sc" x="780" y="208">≥ 1.00 → 1 条</text><text class="f-s" x="40" y="300">门槛每抬一档，规则就少一批：0.50 留 4 条，0.80 留 2 条，1.00 只剩 1 条。</text>
</svg>
