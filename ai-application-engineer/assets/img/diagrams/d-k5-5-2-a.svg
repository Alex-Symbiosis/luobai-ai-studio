<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="三个 K 的边界与错分">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">三个 K 的边界与错分</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">K</text><text class="f-t" x="240.0" y="98">边界形状</text><text class="f-t" x="408.0" y="98">偏差</text><text class="f-t" x="576.0" y="98">方差</text><text class="f-t" x="744.0" y="98">典型问题</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">1</text><text class="f-s" x="240.0" y="139.0">锯齿状，贴着每个点</text><text class="f-s" x="408.0" y="139.0">低</text><text class="f-s" x="576.0" y="139.0">高</text><text class="f-s" x="744.0" y="139.0">被噪声带偏</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">5</text><text class="f-s" x="240.0" y="183.0">较平滑，局部弯曲</text><text class="f-s" x="408.0" y="183.0">中</text><text class="f-s" x="576.0" y="183.0">中</text><text class="f-s" x="744.0" y="183.0">常用起点</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">50</text><text class="f-s" x="240.0" y="227.0">接近直线，过度平滑</text><text class="f-s" x="408.0" y="227.0">高</text><text class="f-s" x="576.0" y="227.0">低</text><text class="f-s" x="744.0" y="227.0">少数类被淹没</text><text class="f-s" x="60" y="272">K 是平滑旋钮：调小更敏感，调大更稳但更钝；用验证曲线选，不靠直觉。</text>
</svg>
