<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="过拟合：每个点都穿过去">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="40" y="28">过拟合：每个点都穿过去</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><circle cx="160" cy="250" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="230" cy="210" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="300" cy="180" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="370" cy="155" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="440" cy="140" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="510" cy="132" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="580" cy="138" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="650" cy="155" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="720" cy="185" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="790" cy="225" r="5.5" fill="#2f6fd0" opacity="0.8"/><path d="M140 240 L240 205 L320 175 L400 150 L480 135 L560 132 L640 148 L720 180 L820 220" fill="none" stroke="#3f9b78" stroke-width="2.6"/><line x1="680" y1="72" x2="706" y2="72" stroke="#3f9b78" stroke-width="2.6"/><text class="f-s" x="714" y="76">合适</text><path d="M140 250 L170 205 L230 210 L270 160 L300 180 L340 130 L370 155 L420 120 L440 140 L490 110 L510 132 L560 118 L580 138 L620 135 L650 155 L700 170 L720 185 L760 205 L790 225 L820 215" fill="none" stroke="#c0504d" stroke-width="2.6"/><line x1="680" y1="94" x2="706" y2="94" stroke="#c0504d" stroke-width="2.6"/><text class="f-s" x="714" y="98">高阶：拟合噪声</text><text class="f-s" x="100" y="340">曲线越「贴合每个点」，验证误差往往越高——它学到的不是规律，是噪声。</text>
</svg>
