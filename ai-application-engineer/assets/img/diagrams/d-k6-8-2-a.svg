<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="输出尺寸：三个公式够用">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">输出尺寸：三个公式够用</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">参数</text><text class="f-t" x="282.0" y="98">公式</text><text class="f-t" x="492.0" y="98">示例</text><text class="f-t" x="702.0" y="98">结果</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">输出边长</text><text class="f-s" x="282.0" y="139.0">(H − k + 2p)/s + 1</text><text class="f-s" x="492.0" y="139.0">H=28,k=3,p=0,s=1</text><text class="f-s" x="702.0" y="139.0">26</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">同卷积</text><text class="f-s" x="282.0" y="183.0">p=(k−1)/2</text><text class="f-s" x="492.0" y="183.0">k=3 → p=1</text><text class="f-s" x="702.0" y="183.0">28</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">参数量</text><text class="f-s" x="282.0" y="227.0">k×k×C_in×C_out + C_out</text><text class="f-s" x="492.0" y="227.0">3×3×3×16+16</text><text class="f-s" x="702.0" y="227.0">448</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">计算量</text><text class="f-s" x="282.0" y="271.0">H_out×W_out×k²×C_in×C_out</text><text class="f-s" x="492.0" y="271.0">26²×9×3×16</text><text class="f-s" x="702.0" y="271.0">292,032</text><text class="f-s" x="60" y="316">先算形状再算参数量，是读任何 CNN 代码的第一步。</text>
</svg>
