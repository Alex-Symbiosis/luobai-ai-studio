<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="动词定框架，句子成分按格填">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">动词定框架，句子成分按格填</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">格角色</text><text class="f-t" x="282.0" y="98">回答的问题</text><text class="f-t" x="492.0" y="98">句中成分</text><text class="f-t" x="702.0" y="98">例子</text><rect class="f-b3" x="60" y="112.0" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="135.8">施事</text><text class="f-s" x="282.0" y="135.8">谁做的</text><text class="f-s" x="492.0" y="135.8">主语</text><text class="f-s" x="702.0" y="135.8">老师 打开了门</text><rect class="f-b3" x="60" y="149.6" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="173.4">受事</text><text class="f-s" x="282.0" y="173.4">对谁做</text><text class="f-s" x="492.0" y="173.4">宾语</text><text class="f-s" x="702.0" y="173.4">打开了 门</text><rect class="f-b3" x="60" y="187.2" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="211.0">工具</text><text class="f-s" x="282.0" y="211.0">用什么</text><text class="f-s" x="492.0" y="211.0">介词短语</text><text class="f-s" x="702.0" y="211.0">用 钥匙 打开</text><rect class="f-b3" x="60" y="224.8" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="248.60000000000002">处所</text><text class="f-s" x="282.0" y="248.60000000000002">在哪里</text><text class="f-s" x="492.0" y="248.60000000000002">介词短语</text><text class="f-s" x="702.0" y="248.60000000000002">在 教室 里</text><rect class="f-b3" x="60" y="262.4" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="286.2">目标</text><text class="f-s" x="282.0" y="286.2">给谁</text><text class="f-s" x="492.0" y="286.2">间接宾语</text><text class="f-s" x="702.0" y="286.2">给 学生 讲</text><text class="f-s" x="60" y="328.0">同一个动词换格框架，句子成分就换位置；格角色由动词的语义决定。</text>
</svg>
