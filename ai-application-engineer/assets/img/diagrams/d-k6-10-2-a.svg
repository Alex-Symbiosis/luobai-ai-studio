.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">Q 表：每个「状态—动作」一个数</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">状态</text><text class="f-t" x="282.0" y="98">动作 左</text><text class="f-t" x="492.0" y="98">动作 右</text><text class="f-t" x="702.0" y="98">贪心选择</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">s0</text><text class="f-s" x="282.0" y="139.0">0.00</text><text class="f-s" x="492.0" y="139.0">0.00</text><text class="f-s" x="702.0" y="139.0">任选（未学）</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">s1</text><text class="f-s" x="282.0" y="183.0">0.20</text><text class="f-s" x="492.0" y="183.0">0.90</text><text class="f-s" x="702.0" y="183.0">右</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">s2</text><text class="f-s" x="282.0" y="227.0">0.35</text><text class="f-s" x="492.0" y="227.0">0.10</text><text class="f-s" x="702.0" y="227.0">左</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">s3</text><text class="f-s" x="282.0" y="271.0">0.00</text><text class="f-s" x="492.0" y="271.0">0.00</text><text class="f-s" x="702.0" y="271.0">终点</text><text class="f-s" x="60" y="316">Q(s,a) 是「在 s 做 a 之后，按当前策略继续走的期望回报」；表大了就存不下。</text>
</svg>
