<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="同样是「非表格」，一个拼张量，一个走图">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="40" y="26">同样是「非表格」，一个拼张量，一个走图</text><rect class="f-b" x="60" y="46" width="400" height="248" rx="12"/><text class="f-t" x="80" y="74">神经网络：输入是定长张量</text><rect class="f-b3" x="96" y="92" width="52" height="30" rx="4"/><text class="f-sc" x="122" y="112">3</text><rect class="f-b3" x="158" y="92" width="52" height="30" rx="4"/><text class="f-sc" x="184" y="112">7</text><rect class="f-b3" x="220" y="92" width="52" height="30" rx="4"/><text class="f-sc" x="246" y="112">1</text><rect class="f-b3" x="282" y="92" width="52" height="30" rx="4"/><text class="f-sc" x="308" y="112">9</text><rect class="f-b3" x="96" y="132" width="52" height="30" rx="4"/><text class="f-sc" x="122" y="152">2</text><rect class="f-b3" x="158" y="132" width="52" height="30" rx="4"/><text class="f-sc" x="184" y="152">8</text><rect class="f-b3" x="220" y="132" width="52" height="30" rx="4"/><text class="f-sc" x="246" y="152">5</text><rect class="f-b3" x="282" y="132" width="52" height="30" rx="4"/><text class="f-sc" x="308" y="152">4</text><rect class="f-b3" x="96" y="172" width="52" height="30" rx="4"/><text class="f-sc" x="122" y="192">6</text><rect class="f-b3" x="158" y="172" width="52" height="30" rx="4"/><text class="f-sc" x="184" y="192">0</text><rect class="f-b3" x="220" y="172" width="52" height="30" rx="4"/><text class="f-sc" x="246" y="192">3</text><rect class="f-b3" x="282" y="172" width="52" height="30" rx="4"/><text class="f-sc" x="308" y="192">7</text><text class="f-s" x="80" y="234">行列位置固定：换一张图，形状不变</text><text class="f-s" x="80" y="258">适合把信号摊平成向量再学</text><text class="f-s" x="80" y="282">样本不足时容易过拟合</text><path class="f-dash" d="M480 66 L480 282"/><rect class="f-b2" x="500" y="46" width="400" height="248" rx="12"/><text class="f-t" x="520" y="74">Web 挖掘：输入是图</text><path class="f-ar" d="M560 120 L635 96"/><path class="f-ar" d="M560 120 L600 190"/><path class="f-ar" d="M635 96 L668 156"/><path class="f-ar" d="M668 156 L600 190"/><path class="f-ar" d="M668 156 L762 168"/><path class="f-ar" d="M600 190 L700 216"/><path class="f-ar" d="M700 216 L762 168"/><path class="f-ar" d="M762 168 L800 110"/><circle cx="560" cy="120" r="10" fill="#2f6fd0" opacity="0.8"/><circle cx="635" cy="96" r="10" fill="#2f6fd0" opacity="0.8"/><circle cx="668" cy="156" r="10" fill="#2f6fd0" opacity="0.8"/><circle cx="600" cy="190" r="10" fill="#2f6fd0" opacity="0.8"/><circle cx="700" cy="216" r="10" fill="#2f6fd0" opacity="0.8"/><circle cx="762" cy="168" r="10" fill="#2f6fd0" opacity="0.8"/><circle cx="800" cy="110" r="10" fill="#2f6fd0" opacity="0.8"/><text class="f-s" x="520" y="254">节点数不固定：每个网页是一个节点</text><text class="f-s" x="520" y="278">边就是超链接，结构本身就是信息</text><text class="f-s" x="40" y="330">先看输入长什么样：定长的摊成张量，连着的按图处理。</text>
</svg>
