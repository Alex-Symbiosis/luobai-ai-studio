<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="六步流程：每一步都要有可验收的产出">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="42">六步流程：每一步都要有可验收的产出</text><rect class="f-b2" x="40.0" y="92" width="125.0" height="96" rx="9"/><text class="f-tc" x="102.5" y="135.0">问题定义</text><text class="f-sc" x="102.5" y="154.0">任务与指标</text><path class="f-ar" d="M168.0 140.0 L187.0 140.0" marker-end="url(#ah)"/><rect class="f-b" x="191.0" y="92" width="125.0" height="96" rx="9"/><text class="f-tc" x="253.5" y="135.0">数据</text><text class="f-sc" x="253.5" y="154.0">采集与清洗</text><path class="f-ar" d="M319.0 140.0 L338.0 140.0" marker-end="url(#ah)"/><rect class="f-b" x="342.0" y="92" width="125.0" height="96" rx="9"/><text class="f-tc" x="404.5" y="135.0">特征</text><text class="f-sc" x="404.5" y="154.0">变换与编码</text><path class="f-ar" d="M470.0 140.0 L489.0 140.0" marker-end="url(#ah)"/><rect class="f-b" x="493.0" y="92" width="125.0" height="96" rx="9"/><text class="f-tc" x="555.5" y="135.0">模型</text><text class="f-sc" x="555.5" y="154.0">训练与调参</text><path class="f-ar" d="M621.0 140.0 L640.0 140.0" marker-end="url(#ah)"/><rect class="f-b" x="644.0" y="92" width="125.0" height="96" rx="9"/><text class="f-tc" x="706.5" y="135.0">评估</text><text class="f-sc" x="706.5" y="154.0">独立测试集</text><path class="f-ar" d="M772.0 140.0 L791.0 140.0" marker-end="url(#ah)"/><rect class="f-b2" x="795.0" y="92" width="125.0" height="96" rx="9"/><text class="f-tc" x="857.5" y="135.0">部署</text><text class="f-sc" x="857.5" y="154.0">监控与回流</text><path class="f-dash" d="M40 268 L920 268"/><text class="f-s" x="40" y="296">顺序即约束：前一步的产出是后一步的输入；顺序错了，结论就不可信。</text>
</svg>
