<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="深层结构定意义，转换规则定语序">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="42">深层结构定意义，转换规则定语序</text><rect class="f-b2" x="40.0" y="92" width="200.5" height="96" rx="9"/><text class="f-tc" x="140.25" y="135.0">深层结构</text><text class="f-sc" x="140.25" y="154.0">语义角色的原始位置</text><path class="f-ar" d="M243.5 140.0 L262.5 140.0" marker-end="url(#ah)"/><rect class="f-b" x="266.5" y="92" width="200.5" height="96" rx="9"/><text class="f-tc" x="366.75" y="135.0">转换</text><text class="f-sc" x="366.75" y="154.0">移位、删除、插入</text><path class="f-ar" d="M470.0 140.0 L489.0 140.0" marker-end="url(#ah)"/><rect class="f-b" x="493.0" y="92" width="200.5" height="96" rx="9"/><text class="f-tc" x="593.25" y="135.0">表层结构</text><text class="f-sc" x="593.25" y="154.0">成分顺序已调整</text><path class="f-ar" d="M696.5 140.0 L715.5 140.0" marker-end="url(#ah)"/><rect class="f-b2" x="719.5" y="92" width="200.5" height="96" rx="9"/><text class="f-tc" x="819.75" y="135.0">语音形式</text><text class="f-sc" x="819.75" y="154.0">说出来或写出来</text><text class="f-s" x="40" y="244">「谁做了什么」在深层已定；被动和疑问只是把同一份关系换个排列说出来。</text><path class="f-dash" d="M40 268 L920 268"/><text class="f-s" x="40" y="296">顺序即约束：前一步的产出是后一步的输入；顺序错了，结论就不可信。</text>
</svg>
