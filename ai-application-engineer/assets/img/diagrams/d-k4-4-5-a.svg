.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="40" y="28">阶数扫描：验证误差的 U 形</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M120 250 L200 190 L280 150 L360 122 L440 105 L520 96 L600 92 L680 96 L760 110 L840 135" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">训练误差</text><path d="M120 258 L200 210 L280 175 L360 150 L440 135 L520 132 L600 145 L680 170 L760 205 L840 245" fill="none" stroke="#d98b3a" stroke-width="2.4"/><line x1="700" y1="90" x2="726" y2="90" stroke="#d98b3a" stroke-width="2.6"/><text class="f-s" x="734" y="94">验证误差</text><circle class="f-pt" cx="520" cy="132" r="6"/><text class="f-s" x="530" y="124">拐点：合适复杂度</text><text class="f-s" x="880" y="322" text-anchor="end">多项式阶数</text><text class="f-s" x="92" y="66" text-anchor="end">误差</text><text class="f-s" x="100" y="340">训练误差单调下降，验证误差先降后升；最低点就是容量与泛化的平衡点。</text>
</svg>
