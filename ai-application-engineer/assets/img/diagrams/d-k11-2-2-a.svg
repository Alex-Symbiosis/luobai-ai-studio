<text class="f-h" x="40" y="28">齐夫分布：少数词高频，多数词只出现一两次</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M110 110.0 L178 172.87923301022596 L246 198.91280524102615 L314 213.79292188737256 L382 223.63927800864082 L450 230.7322104826781 L518 236.13437289303005 L586 240.4142697855525 L654 243.9062386163376 L722 246.82100745764916 L790 249.2986288221216 L858 251.43617241079318" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><text class="f-s" x="130" y="120">前几名：the / is / a</text><text class="f-s" x="560" y="262">长尾：绝大多数 type 只出现一两次</text><circle class="f-pt" cx="246" cy="186" r="6"/><text class="f-s" x="256" y="178">Top10 覆盖大半 token</text><text class="f-s" x="880" y="322" text-anchor="end">词按频率排名 →</text><text class="f-s" x="92" y="66" text-anchor="end">词频</text><text class="f-s" x="100" y="340">token 总数看「量」，type 总数看「种类」；同一份文本，两个数字回答两个问题。</text>
