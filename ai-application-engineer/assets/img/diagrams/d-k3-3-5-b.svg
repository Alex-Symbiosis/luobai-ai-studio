<text class="f-h" x="40" y="28">同一份数据，两种流程的准确率</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 62 L100 300"/><rect x="205.3" y="148.79999999999998" width="179.4" height="151.20000000000002" rx="4" fill="#4f83cf" opacity="0.9"/><text class="f-sc" x="295.0" y="140.79999999999998">72%</text><text class="f-sc" x="295.0" y="318">先划分后标准化</text><rect x="595.3" y="98.39999999999998" width="179.4" height="201.60000000000002" rx="4" fill="#d98b3a" opacity="0.9"/><text class="f-sc" x="685.0" y="90.39999999999998">96%</text><text class="f-sc" x="685.0" y="318">先标准化后划分</text><text class="f-s" x="100" y="344">后者把测试集的均值与方差带进了训练，分数虚高，上线即回落。</text>
