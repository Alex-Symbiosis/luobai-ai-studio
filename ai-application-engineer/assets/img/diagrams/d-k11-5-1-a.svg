<text class="f-h" x="40" y="28">三层齐全，才叫语料库</text><circle cx="300" cy="195" r="150" fill="#f8fbff" stroke="#cfe0ff" stroke-width="1.5"/><circle cx="300" cy="195" r="105" fill="#f0f6ff" stroke="#cfe0ff" stroke-width="1.5"/><circle cx="300" cy="195" r="58" fill="#e6efff" stroke="#cfe0ff" stroke-width="1.5"/><text class="f-tc" x="300" y="75">原始文本</text><text class="f-sc" x="300" y="93">txt / jsonl</text><text class="f-tc" x="300" y="124">元数据</text><text class="f-sc" x="300" y="142">来源·时间·作者</text><text class="f-tc" x="300" y="171">标注层</text><text class="f-sc" x="300" y="189">词性·实体·标签</text><path class="f-dash" d="M452 98 L560 98"/><text class="f-t" x="572" y="96">可检索</text><text class="f-s" x="572" y="116">按字段筛选</text><path class="f-dash" d="M452 174 L560 174"/><text class="f-t" x="572" y="172">可追溯</text><text class="f-s" x="572" y="192">来源与许可清楚</text><path class="f-dash" d="M452 242 L560 242"/><text class="f-t" x="572" y="240">可训练</text><text class="f-s" x="572" y="260">标注口径一致</text><text class="f-s" x="40" y="340">没有元数据的文本，只是一堆文件；没有标注层的语料，只能做无监督统计。</text>
