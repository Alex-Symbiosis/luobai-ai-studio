<text class="f-h" x="40" y="30">没有答案时，只能从结构入手</text><rect class="f-b3" x="60" y="50" width="840" height="256" rx="10"/><path class="f-ax" d="M90 288 L880 288"/><path class="f-ax" d="M90 70 L90 288"/><circle cx="180" cy="120" r="6" fill="#2f6fd0" opacity="0.85"/><circle cx="205" cy="140" r="6" fill="#2f6fd0" opacity="0.85"/><circle cx="160" cy="150" r="6" fill="#2f6fd0" opacity="0.85"/><circle cx="195" cy="105" r="6" fill="#2f6fd0" opacity="0.85"/><circle cx="220" cy="165" r="6" fill="#2f6fd0" opacity="0.85"/><ellipse class="f-dash" cx="190" cy="136" rx="78" ry="62"/><circle cx="400" cy="230" r="6" fill="#d98b3a" opacity="0.85"/><circle cx="430" cy="215" r="6" fill="#d98b3a" opacity="0.85"/><circle cx="455" cy="245" r="6" fill="#d98b3a" opacity="0.85"/><circle cx="415" cy="258" r="6" fill="#d98b3a" opacity="0.85"/><circle cx="385" cy="240" r="6" fill="#d98b3a" opacity="0.85"/><ellipse class="f-dash" cx="420" cy="238" rx="76" ry="56"/><circle cx="690" cy="130" r="6" fill="#3f9b78" opacity="0.85"/><circle cx="720" cy="115" r="6" fill="#3f9b78" opacity="0.85"/><circle cx="745" cy="140" r="6" fill="#3f9b78" opacity="0.85"/><circle cx="700" cy="155" r="6" fill="#3f9b78" opacity="0.85"/><circle cx="730" cy="165" r="6" fill="#3f9b78" opacity="0.85"/><ellipse class="f-dash" cx="718" cy="140" rx="74" ry="58"/><text class="f-s" x="60" y="336">相似度怎么定义，分组就长什么样；没有标签，结果必须由领域知识解释。</text>
