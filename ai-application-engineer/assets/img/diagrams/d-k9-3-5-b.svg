<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="四种语法，四个不同的关注点">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">四种语法，四个不同的关注点</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">语法</text><text class="f-t" x="240.0" y="98">关注点</text><text class="f-t" x="408.0" y="98">基本单位</text><text class="f-t" x="576.0" y="98">典型问题</text><text class="f-t" x="744.0" y="98">代表标注</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">转换语法</text><text class="f-s" x="240.0" y="139.0">句法转换</text><text class="f-s" x="408.0" y="139.0">句子</text><text class="f-s" x="576.0" y="139.0">深层结构怎么变成表层</text><text class="f-s" x="744.0" y="139.0">NP / VP 树</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">系统语法</text><text class="f-s" x="240.0" y="183.0">功能选择</text><text class="f-s" x="408.0" y="183.0">小句</text><text class="f-s" x="576.0" y="183.0">为什么这样说而不是那样</text><text class="f-s" x="744.0" y="183.0">及物性系统</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">格语法</text><text class="f-s" x="240.0" y="227.0">语义角色</text><text class="f-s" x="408.0" y="227.0">动词框架</text><text class="f-s" x="576.0" y="227.0">谁对谁做了什么</text><text class="f-s" x="744.0" y="227.0">施事 / 受事</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">语义语法</text><text class="f-s" x="240.0" y="271.0">结构即意义</text><text class="f-s" x="408.0" y="271.0">句法语义配对</text><text class="f-s" x="576.0" y="271.0">结构怎么承载意义</text><text class="f-s" x="744.0" y="271.0">语义特征</text><text class="f-s" x="60" y="316">问法不同，标注就不同；四套标注不能互相替代。</text>
</svg>
