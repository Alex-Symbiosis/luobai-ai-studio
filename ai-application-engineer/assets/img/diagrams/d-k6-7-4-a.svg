<text class="f-h" x="40" y="28">过拟合与欠拟合，看两条曲线的间距</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M100 90 L200 140 L320 190 L460 235 L620 265 L880 280" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">欠拟合：都高</text><path d="M100 120 L200 210 L300 268 L400 286 L520 292 L880 294" fill="none" stroke="#3f9b78" stroke-width="2.4"/><line x1="700" y1="90" x2="726" y2="90" stroke="#3f9b78" stroke-width="2.6"/><text class="f-s" x="734" y="94">正常：都低</text><path d="M100 120 L220 230 L340 280 L460 294 L600 250 L740 190 L880 150" fill="none" stroke="#d9534f" stroke-width="2.4"/><line x1="700" y1="110" x2="726" y2="110" stroke="#d9534f" stroke-width="2.6"/><text class="f-s" x="734" y="114">过拟合：验证回升</text>
