="f-s" x="702.0" y="237.85714285714286">48,120</text><rect class="f-b3" x="60" y="246.28571428571428" width="840" height="26.857142857142858" rx="0"/><text class="f-s" x="72.0" y="264.7142857142857">F6 全连接</text><text class="f-s" x="282.0" y="264.7142857142857">84</text><text class="f-s" x="492.0" y="264.7142857142857">120×84</text><text class="f-s" x="702.0" y="264.7142857142857">10,164</text><rect class="f-b3" x="60" y="273.1428571428571" width="840" height="26.857142857142858" rx="0"/><text class="f-s" x="72.0" y="291.57142857142856">输出</text><text class="f-s" x="282.0" y="291.57142857142856">10</text><text class="f-s" x="492.0" y="291.57142857142856">84×10</text><text class="f-s" x="702.0" y="291.57142857142856">850</text><text class="f-s" x="60" y="328.0">合计 61,706；按原始稀疏连接口径为 60,850，差在 C3 与 S 层系数。</text>
