<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="任务决定输出层与损失">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">任务决定输出层与损失</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">任务</text><text class="f-t" x="282.0" y="98">输出层</text><text class="f-t" x="492.0" y="98">损失函数</text><text class="f-t" x="702.0" y="98">标签形式</text><rect class="f-b3" x="60" y="112.0" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="135.8">二分类</text><text class="f-s" x="282.0" y="135.8">1 个 Sigmoid</text><text class="f-s" x="492.0" y="135.8">binary_crossentropy</text><text class="f-s" x="702.0" y="135.8">0 / 1</text><rect class="f-b3" x="60" y="149.6" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="173.4">多分类</text><text class="f-s" x="282.0" y="173.4">K 个 Softmax</text><text class="f-s" x="492.0" y="173.4">sparse_categorical…</text><text class="f-s" x="702.0" y="173.4">整数 0…K−1</text><rect class="f-b3" x="60" y="187.2" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="211.0">多标签</text><text class="f-s" x="282.0" y="211.0">K 个 Sigmoid</text><text class="f-s" x="492.0" y="211.0">binary_crossentropy</text><text class="f-s" x="702.0" y="211.0">K 位 0/1</text><rect class="f-b3" x="60" y="224.8" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="248.60000000000002">回归</text><text class="f-s" x="282.0" y="248.60000000000002">1 个线性</text><text class="f-s" x="492.0" y="248.60000000000002">mse / huber</text><text class="f-s" x="702.0" y="248.60000000000002">实数</text><rect class="f-b3" x="60" y="262.4" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="286.2">排序 / 对比</text><text class="f-s" x="282.0" y="286.2">向量嵌入</text><text class="f-s" x="492.0" y="286.2">triplet / 对比损失</text><text class="f-s" x="702.0" y="286.2">样本对</text><text class="f-s" x="60" y="328.0">输出层与损失必须成对出现；配错时模型仍能训，但学的不是你想的目标。</text>
</svg>
