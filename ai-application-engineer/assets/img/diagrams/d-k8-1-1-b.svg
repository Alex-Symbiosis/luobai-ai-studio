<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="30">数据、信息、知识、决策：四级阶梯</text><rect class="f-b" x="70" y="252" width="180" height="62" rx="9"/><text class="f-tc" x="160" y="278">数据</text><text class="f-sc" x="160" y="298">订单里的原始记录</text><text class="f-sc" x="160" y="332">发生了什么？</text><path class="f-ar" d="M252 270 L288 218" marker-end="url(#ah)"/><rect class="f-b" x="290" y="196" width="180" height="62" rx="9"/><text class="f-tc" x="380" y="222">信息</text><text class="f-sc" x="380" y="242">本月牛奶销量上升</text><text class="f-sc" x="380" y="276">说明什么？</text><path class="f-ar" d="M472 214 L508 162" marker-end="url(#ah)"/><rect class="f-b" x="510" y="140" width="180" height="62" rx="9"/><text class="f-tc" x="600" y="166">知识</text><text class="f-sc" x="600" y="186">雨天牛奶更好卖</text><text class="f-sc" x="600" y="220">为什么？</text><path class="f-ar" d="M692 158 L728 106" marker-end="url(#ah)"/><rect class="f-b2" x="730" y="84" width="180" height="62" rx="9"/><text class="f-tc" x="820" y="110">决策</text><text class="f-sc" x="820" y="130">雨天提前补货</text><text class="f-sc" x="820" y="164">该做什么？</text><text class="f-s" x="40" y="348">每上一层多一次加工；越往上，越接近可以直接执行的动作。</text>
