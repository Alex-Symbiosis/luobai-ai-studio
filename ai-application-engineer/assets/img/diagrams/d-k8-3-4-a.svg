<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="三个指标，判断一张规则值不值">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">三个指标，判断一张规则值不值</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">指标</text><text class="f-t" x="282.0" y="98">算的是什么</text><text class="f-t" x="492.0" y="98">手算结果</text><text class="f-t" x="702.0" y="98">怎么读</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">支持度</text><text class="f-s" x="282.0" y="139.0">同时出现的交易占比</text><text class="f-s" x="492.0" y="139.0">3/12 = 0.25</text><text class="f-s" x="702.0" y="139.0">低于阈值就不算频繁</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">置信度</text><text class="f-s" x="282.0" y="183.0">买了 A 又买 B 的比例</text><text class="f-s" x="492.0" y="183.0">3/3 = 1.00</text><text class="f-s" x="702.0" y="183.0">很高也可能只是巧合</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">提升度</text><text class="f-s" x="282.0" y="227.0">比单独购买高多少倍</text><text class="f-s" x="492.0" y="227.0">3.000 与 1.286</text><text class="f-s" x="702.0" y="227.0">大于 1 才是正向关联</text><text class="f-s" x="60" y="272">手算示例：12 条交易里，牛奶 3 条、面包 4 条、同时出现 3 条；提升度 1.00 ÷ 0.33 = 3.000。</text>
</svg>
