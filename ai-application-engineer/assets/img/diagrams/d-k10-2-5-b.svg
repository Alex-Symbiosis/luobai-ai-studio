<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="模型里的值，分四类看">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">模型里的值，分四类看</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">对象</text><text class="f-t" x="282.0" y="98">可修改</text><text class="f-t" x="492.0" y="98">有梯度</text><text class="f-t" x="702.0" y="98">要保存</text><rect class="f-b3" x="60" y="112.0" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="135.8">输入 x</text><text class="f-s" x="282.0" y="135.8">否</text><text class="f-s" x="492.0" y="135.8">通常否</text><text class="f-s" x="702.0" y="135.8">否</text><rect class="f-b3" x="60" y="149.6" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="173.4">权重 w / 偏置 b</text><text class="f-s" x="282.0" y="173.4">是</text><text class="f-s" x="492.0" y="173.4">是</text><text class="f-s" x="702.0" y="173.4">是</text><rect class="f-b3" x="60" y="187.2" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="211.0">中间激活</text><text class="f-s" x="282.0" y="211.0">否</text><text class="f-s" x="492.0" y="211.0">是（对上游）</text><text class="f-s" x="702.0" y="211.0">否</text><rect class="f-b3" x="60" y="224.8" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="248.60000000000002">损失 / 预测</text><text class="f-s" x="282.0" y="248.60000000000002">否</text><text class="f-s" x="492.0" y="248.60000000000002">是（对参数）</text><text class="f-s" x="702.0" y="248.60000000000002">否</text><rect class="f-b3" x="60" y="262.4" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="286.2">超参数</text><text class="f-s" x="282.0" y="286.2">训练中否</text><text class="f-s" x="492.0" y="286.2">无关</text><text class="f-s" x="702.0" y="286.2">写进配置</text><text class="f-s" x="60" y="328.0">只有「可修改 + 有梯度 + 要保存」的那一行，才用 Variable。</text>
</svg>
