<text class="f-h" x="40" y="28">肘部法选 K</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><path d="M140 110 L220 170 L300 215 L380 245 L460 262 L540 272 L620 278 L700 282 L780 285 L840 287" fill="none" stroke="#2f6fd0" stroke-width="2.4"/><line x1="700" y1="70" x2="726" y2="70" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="734" y="74">组内平方和</text><circle class="f-pt" cx="380" cy="245" r="6"/><text class="f-s" x="390" y="237">拐点 K = 3</text><text class="f-s" x="880" y="322" text-anchor="end">K</text><text class="f-s" x="92" y="66" text-anchor="end">SSE</text><text class="f-s" x="100" y="340">拐点之前加簇收益大，之后收益迅速变小；K 的选择要结合业务粒度，不只看曲线。</text>
