<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="四条问答路线，取决于知识存在哪">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">四条问答路线，取决于知识存在哪</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">路线</text><text class="f-t" x="282.0" y="98">知识源</text><text class="f-t" x="492.0" y="98">映射方式</text><text class="f-t" x="702.0" y="98">答案形态</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">NLIDB</text><text class="f-s" x="282.0" y="139.0">结构化表</text><text class="f-s" x="492.0" y="139.0">问句转 SQL</text><text class="f-s" x="702.0" y="139.0">表格结果</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">IRQA</text><text class="f-s" x="282.0" y="183.0">文档集合</text><text class="f-s" x="492.0" y="183.0">问句转检索片段</text><text class="f-s" x="702.0" y="183.0">段落摘取</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">KBQA</text><text class="f-s" x="282.0" y="227.0">知识图谱</text><text class="f-s" x="492.0" y="227.0">问句转查询图</text><text class="f-s" x="702.0" y="227.0">实体或数值</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">CommunityQA</text><text class="f-s" x="282.0" y="271.0">问答社区</text><text class="f-s" x="492.0" y="271.0">问句匹配历史问</text><text class="f-s" x="702.0" y="271.0">他人回答</text><text class="f-s" x="60" y="316">先看知识存在表、文档、图谱还是人身上，再选路线，不要反过来。</text>
</svg>
