<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="一张表里，每一列都要先认领角色">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">一张表里，每一列都要先认领角色</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">表头</text><text class="f-t" x="212.0" y="98">面积</text><text class="f-t" x="352.0" y="98">楼层</text><text class="f-t" x="492.0" y="98">装修</text><text class="f-t" x="632.0" y="98">成交价</text><text class="f-t" x="772.0" y="98">备注</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">角色</text><text class="f-s" x="212.0" y="139.0">特征</text><text class="f-s" x="352.0" y="139.0">特征</text><text class="f-s" x="492.0" y="139.0">特征（类别）</text><text class="f-s" x="632.0" y="139.0">标签</text><text class="f-s" x="772.0" y="139.0">无关/泄漏风险</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">类型</text><text class="f-s" x="212.0" y="183.0">连续数值</text><text class="f-s" x="352.0" y="183.0">有序数值</text><text class="f-s" x="492.0" y="183.0">无序类别</text><text class="f-s" x="632.0" y="183.0">连续数值</text><text class="f-s" x="772.0" y="183.0">文本</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">处理</text><text class="f-s" x="212.0" y="227.0">可直接用</text><text class="f-s" x="352.0" y="227.0">可保留序</text><text class="f-s" x="492.0" y="227.0">需编码</text><text class="f-s" x="632.0" y="227.0">只作目标</text><text class="f-s" x="772.0" y="227.0">先审查再决定</text><text class="f-s" x="60" y="272">特征与标签的角色由任务决定：预测成交价时它是标签，预测是否成交时它只是特征。</text>
</svg>
