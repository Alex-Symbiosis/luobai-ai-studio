<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="每一片叶子都要落到一个可查的指标">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="28">每一片叶子都要落到一个可查的指标</text><rect class="f-b2" x="360" y="42" width="240" height="52" rx="9"/><text class="f-tc" x="480" y="66">复购率下降</text><text class="f-sc" x="480" y="84">大问题：先拆成三支</text><path class="f-ar" d="M480 96 L185 146" marker-end="url(#ah)"/><rect class="f-b" x="60" y="148" width="250" height="146" rx="10"/><text class="f-tc" x="185" y="178">新客变少</text><text class="f-s" x="78" y="212">· 渠道投放量环比 -18%</text><text class="f-s" x="78" y="242">· 新客 30 日留存 12%</text><text class="f-sc" x="185" y="276">两支都能单独查数</text><path class="f-ar" d="M480 96 L480 146" marker-end="url(#ah)"/><rect class="f-b" x="355" y="148" width="250" height="146" rx="10"/><text class="f-tc" x="480" y="178">老客变少</text><text class="f-s" x="373" y="212">· 投诉率由 2.1% 升到 3.4%</text><text class="f-s" x="373" y="242">· 平均履约时长多 1.5 天</text><text class="f-sc" x="480" y="276">两支都能单独查数</text><path class="f-ar" d="M480 96 L775 146" marker-end="url(#ah)"/><rect class="f-b" x="650" y="148" width="250" height="146" rx="10"/><text class="f-tc" x="775" y="178">买得更少</text><text class="f-s" x="668" y="212">· 客单价下降 6%</text><text class="f-s" x="668" y="242">· 人均购买品类 3.2 → 2.7</text><text class="f-sc" x="775" y="276">两支都能单独查数</text><text class="f-s" x="40" y="326">示例数字只说明拆法，不代表真实业务数据；叶子落不到指标，就继续拆。</text>
</svg>
