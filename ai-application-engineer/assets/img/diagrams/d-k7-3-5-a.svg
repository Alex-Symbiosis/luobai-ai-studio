<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="40" y="42">实体对齐：候选对一路筛到人工复核</text><rect class="f-b2" x="40.0" y="92" width="103.42857142857143" height="96" rx="9"/><text class="f-tc" x="91.71428571428572" y="135.0">候选对</text><text class="f-sc" x="91.71428571428572" y="154.0">先分块再两两比</text><path class="f-ar" d="M146.42857142857144 140.0 L165.42857142857144 140.0" marker-end="url(#ah)"/><rect class="f-b" x="169.42857142857144" y="92" width="103.42857142857143" height="96" rx="9"/><text class="f-tc" x="221.14285714285717" y="135.0">名称相似</text><text class="f-sc" x="221.14285714285717" y="154.0">别名与编辑距离</text><path class="f-ar" d="M275.8571428571429 140.0 L294.8571428571429 140.0" marker-end="url(#ah)"/><rect class="f-b" x="298.8571428571429" y="92" width="103.42857142857143" height="96" rx="9"/><text class="f-tc" x="350.5714285714286" y="135.0">属性相似</text><text class="f-sc" x="350.5714285714286" y="154.0">关键属性逐项比</text><path class="f-ar" d="M405.28571428571433 140.0 L424.28571428571433 140.0" marker-end="url(#ah)"/><rect class="f-b" x="428.28571428571433" y="92" width="103.42857142857143" height="96" rx="9"/><text class="f-tc" x="480.00000000000006" y="135.0">结构相似</text><text class="f-sc" x="480.00000000000006" y="154.0">共同邻居占比</text><path class="f-ar" d="M534.7142857142858 140.0 L553.7142857142858 140.0" marker-end="url(#ah)"/><rect class="f-b" x="557.7142857142858" y="92" width="103.42857142857143" height="96" rx="9"/><text class="f-tc" x="609.4285714285714" y="135.0">加权得分</text><text class="f-sc" x="609.4285714285714" y="154.0">三项加权求和</text><path class="f-ar" d="M664.1428571428572 140.0 L683.1428571428572 140.0" marker-end="url(#ah)"/><rect class="f-b" x="687.1428571428572" y="92" width="103.42857142857143" height="96" rx="9"/><text class="f-tc" x="738.8571428571429" y="135.0">阈值判定</text><text class="f-sc" x="738.8571428571429" y="154.0">高于阈值则合并</text><path class="f-ar" d="M793.5714285714287 140.0 L812.5714285714287 140.0" marker-end="url(#ah)"/><rect class="f-b2" x="816.5714285714287" y="92" width="103.42857142857143" height="96" rx="9"/><text class="f-tc" x="868.2857142857143" y="135.0">人工复核</text><text class="f-sc" x="868.2857142857143" y="154.0">抽样确认与回滚</text><text class="f-s" x="40" y="244">不分块直接比较，候选对会爆炸；任何自动合并都要留人工入口。</text><path class="f-dash" d="M40 268 L920 268"/><text class="f-s" x="40" y="296">顺序即约束：前一步的产出是后一步的输入；顺序错了，结论就不可信。</text>
</svg>
