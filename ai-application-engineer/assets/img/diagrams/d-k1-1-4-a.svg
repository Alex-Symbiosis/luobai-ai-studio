<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="判定矩阵：每一格都要有证据">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">判定矩阵：每一格都要有证据</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">系统</text><text class="f-t" x="282.0" y="98">感知/学习</text><text class="f-t" x="492.0" y="98">决策/适应</text><text class="f-t" x="702.0" y="98">判定</text><rect class="f-b3" x="60" y="112.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="132.66666666666669">计算器</text><text class="f-s" x="282.0" y="132.66666666666669">无学习</text><text class="f-s" x="492.0" y="132.66666666666669">固定运算</text><text class="f-s" x="702.0" y="132.66666666666669">不是 AI</text><rect class="f-b3" x="60" y="143.33333333333334" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="164.0">推荐系统</text><text class="f-s" x="282.0" y="164.0">从行为学习</text><text class="f-s" x="492.0" y="164.0">排序与分发</text><text class="f-s" x="702.0" y="164.0">是 AI</text><rect class="f-b3" x="60" y="174.66666666666666" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="195.33333333333331">扫地机器人</text><text class="f-s" x="282.0" y="195.33333333333331">传感器感知</text><text class="f-s" x="492.0" y="195.33333333333331">路径决策</text><text class="f-s" x="702.0" y="195.33333333333331">是 AI（弱）</text><rect class="f-b3" x="60" y="206.0" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="226.66666666666666">专家系统</text><text class="f-s" x="282.0" y="226.66666666666666">规则库</text><text class="f-s" x="492.0" y="226.66666666666666">推理机</text><text class="f-s" x="702.0" y="226.66666666666666">是 AI（符号）</text><rect class="f-b3" x="60" y="237.33333333333331" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="258.0">规则式客服</text><text class="f-s" x="282.0" y="258.0">关键词匹配</text><text class="f-s" x="492.0" y="258.0">固定分支</text><text class="f-s" x="702.0" y="258.0">边界案例</text><rect class="f-b3" x="60" y="268.66666666666663" width="840" height="31.333333333333332" rx="0"/><text class="f-s" x="72.0" y="289.3333333333333">大语言模型</text><text class="f-s" x="282.0" y="289.3333333333333">预训练学习</text><text class="f-s" x="492.0" y="289.3333333333333">生成与工具调用</text><text class="f-s" x="702.0" y="289.3333333333333">是 AI（专用）</text><text class="f-s" x="60" y="328.0">反例比结论更重要：能说出「它缺哪一项」，判定才算完成。</text>
</svg>
