<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94aecd"/></marker></defs><text class="f-h" x="60" y="26">格式会过时，结构不会</text><rect class="f-amber" x="60" y="44" width="390" height="286" rx="12"/><text class="f-t" x="80" y="76">Toolbox（SF）</text><text class="f-s" x="80" y="108">· 行首反斜杠字段：\id \tx \mb \ge</text><text class="f-s" x="80" y="138">· 纯文本、人读友好</text><text class="f-s" x="80" y="168">· 层级靠字段约定，无 schema</text><text class="f-s" x="80" y="198">· 老田野语料仍大量存在</text><rect class="f-b2" x="510" y="44" width="390" height="286" rx="12"/><text class="f-t" x="530" y="76">XML / JSON</text><text class="f-s" x="530" y="108">· 元素或键显式表达层级</text><text class="f-s" x="530" y="138">· 可 schema 校验、可版本化</text><text class="f-s" x="530" y="168">· 工具链与数据库友好</text><text class="f-s" x="530" y="198">· 现代标注与交换格式</text><path class="f-dash" d="M470 60 L470 316"/>
</svg>
