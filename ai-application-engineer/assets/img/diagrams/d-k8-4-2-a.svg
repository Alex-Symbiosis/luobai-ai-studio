<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="同一句「业绩不好」，先切三刀">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">同一句「业绩不好」，先切三刀</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">切法</text><text class="f-t" x="282.0" y="98">怎么分</text><text class="f-t" x="492.0" y="98">例子</text><text class="f-t" x="702.0" y="98">切完能回答什么</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">按对象</text><text class="f-s" x="282.0" y="139.0">客户、产品、区域、渠道</text><text class="f-s" x="492.0" y="139.0">华东 与 华南</text><text class="f-s" x="702.0" y="139.0">是谁在掉</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">按时间</text><text class="f-s" x="282.0" y="183.0">月、季、同比、环比</text><text class="f-s" x="492.0" y="183.0">九月 与 八月</text><text class="f-s" x="702.0" y="183.0">什么时候开始掉</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">按口径</text><text class="f-s" x="282.0" y="227.0">含税/不含税、老客/新客</text><text class="f-s" x="492.0" y="227.0">口径是否一致</text><text class="f-s" x="702.0" y="227.0">是不是算法不同</text><rect class="f-b3" x="60" y="244" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="271.0">按过程</text><text class="f-s" x="282.0" y="271.0">获客—转化—履约</text><text class="f-s" x="492.0" y="271.0">哪一步变慢</text><text class="f-s" x="702.0" y="271.0">卡在哪一环</text><text class="f-s" x="60" y="316">切分维度要互斥且穷尽；同一张表里混用两套口径，比较就没有意义。</text>
</svg>
