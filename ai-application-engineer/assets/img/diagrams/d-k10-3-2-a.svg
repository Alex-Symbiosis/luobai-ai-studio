<text class="f-h" x="60" y="42">数据初诊：五个数，五个判断</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">读数</text><text class="f-t" x="352.0" y="98">看什么</text><text class="f-t" x="632.0" y="98">异常信号</text><rect class="f-b3" x="60" y="112.0" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="135.8">shape</text><text class="f-s" x="352.0" y="135.8">样本数 × 特征数</text><text class="f-s" x="632.0" y="135.8">样本远少于特征</text><rect class="f-b3" x="60" y="149.6" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="173.4">均值 / 标准差</text><text class="f-s" x="352.0" y="173.4">量纲与离散程度</text><text class="f-s" x="632.0" y="173.4">标准差被极端值拉大</text><rect class="f-b3" x="60" y="187.2" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="211.0">最小 / 最大</text><text class="f-s" x="352.0" y="211.0">取值范围</text><text class="f-s" x="632.0" y="211.0">差几个数量级</text><rect class="f-b3" x="60" y="224.8" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="248.60000000000002">标签分布</text><text class="f-s" x="352.0" y="248.60000000000002">各类样本数</text><text class="f-s" x="632.0" y="248.60000000000002">接近 9 : 1 甚至更偏</text><rect class="f-b3" x="60" y="262.4" width="840" height="37.6" rx="0"/><text class="f-s" x="72.0" y="286.2">缺失值个数</text><text class="f-s" x="352.0" y="286.2">每列缺多少</text><text class="f-s" x="632.0" y="286.2">某列大面积缺失</text><text class="f-s" x="60" y="328.0">先看数据再看模型：这五项里任何一项异常，都足以让后面所有调参白做。</text>
