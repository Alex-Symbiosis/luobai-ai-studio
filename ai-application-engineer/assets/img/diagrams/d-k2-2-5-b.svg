<text class="f-h" x="40" y="30">四层任务栈，下层错上层全歪</text><rect class="f-b2" x="120" y="54" width="720" height="56" rx="8"/><text class="f-t" x="146" y="87.0">词法</text><text class="f-s" x="430" y="87.0">分词、词性、命名实体</text><rect class="f-b" x="120" y="118" width="720" height="56" rx="8"/><text class="f-t" x="146" y="151.0">句法</text><text class="f-s" x="430" y="151.0">依存、短语结构</text><rect class="f-b" x="120" y="182" width="720" height="56" rx="8"/><text class="f-t" x="146" y="215.0">语义</text><text class="f-s" x="430" y="215.0">词义消歧、角色标注</text><rect class="f-b" x="120" y="246" width="720" height="56" rx="8"/><text class="f-t" x="146" y="279.0">应用</text><text class="f-s" x="430" y="279.0">检索、问答、翻译、摘要</text><text class="f-s" x="120" y="336">分词切错，句法和语义都无从谈起；应用层的问题，往往要回底层查。</text>
