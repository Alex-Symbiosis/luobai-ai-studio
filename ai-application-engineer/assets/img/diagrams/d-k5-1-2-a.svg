<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="三种问法，三个坐标">
<style>
.f-b{fill:#f6f9ff;stroke:#cfe0ff;stroke-width:1.4}
.f-b2{fill:#eef4ff;stroke:#8fb8ff;stroke-width:1.4}
.f-b3{fill:#ffffff;stroke:#dbe5f2;stroke-width:1.2}
.f-amber{fill:#fdf4e6;stroke:#e6c78a;stroke-width:1.2}
.f-green{fill:#ecf8f1;stroke:#b9e0cd;stroke-width:1.2}
.f-red{fill:#fdeeee;stroke:#e5b5b5;stroke-width:1.2}
.f-t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78}
.f-tc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;fill:#123a78;text-anchor:middle}
.f-h{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78}
.f-hc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:15.5px;font-weight:700;fill:#123a78;text-anchor:middle}
.f-s{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80}
.f-sc{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:11.8px;fill:#5a6b80;text-anchor:middle}
.f-m{font-family:Consolas,"Courier New",monospace;font-size:11.5px;fill:#365a86}
.f-ax{stroke:#c8d7ea;stroke-width:1.2}
.f-ar{stroke:#94aecd;stroke-width:1.7;fill:none}
.f-dash{stroke:#9db4d2;stroke-width:1.3;stroke-dasharray:5 4;fill:none}
.f-dot{fill:#2f6fd0}
.f-pt{fill:#d98b3a}
</style>
<text class="f-h" x="60" y="42">三种问法，三个坐标</text><rect class="f-b2" x="60" y="74" width="840" height="38" rx="7"/><text class="f-t" x="72.0" y="98">维度</text><text class="f-t" x="282.0" y="98">问什么</text><text class="f-t" x="492.0" y="98">两种取值</text><text class="f-t" x="702.0" y="98">代表算法</text><rect class="f-b3" x="60" y="112" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="139.0">生成式 / 判别式</text><text class="f-s" x="282.0" y="139.0">建不建联合概率</text><text class="f-s" x="492.0" y="139.0">建 P(x,y) / 只学 P(y|x)</text><text class="f-s" x="702.0" y="139.0">朴素贝叶斯 / 逻辑回归</text><rect class="f-b3" x="60" y="156" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="183.0">参数 / 非参数</text><text class="f-s" x="282.0" y="183.0">参数随数据增长吗</text><text class="f-s" x="492.0" y="183.0">固定参数 / 随样本增长</text><text class="f-s" x="702.0" y="183.0">线性回归 / KNN</text><rect class="f-b3" x="60" y="200" width="840" height="44" rx="0"/><text class="f-s" x="72.0" y="227.0">线性 / 非线性</text><text class="f-s" x="282.0" y="227.0">边界是什么形状</text><text class="f-s" x="492.0" y="227.0">直线或超平面 / 曲线</text><text class="f-s" x="702.0" y="227.0">SVM 线性核 / 树与核 SVM</text><text class="f-s" x="60" y="272">同一算法在三个维度上各有一个位置；分类不是互斥的单选题。</text>
</svg>
