<text class="f-h" x="40" y="28">一条最贴合的直线</text><path class="f-ax" d="M100 300 L880 300"/><path class="f-ax" d="M100 60 L100 300"/><circle cx="160" cy="244" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="210" cy="238" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="280" cy="220" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="340" cy="214" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="420" cy="190" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="500" cy="176" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="560" cy="168" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="640" cy="150" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="720" cy="138" r="5.5" fill="#2f6fd0" opacity="0.8"/><circle cx="800" cy="126" r="5.5" fill="#2f6fd0" opacity="0.8"/><path d="M140 250 L830 120" fill="none" stroke="#2f6fd0" stroke-width="2.6"/><line x1="680" y1="72" x2="706" y2="72" stroke="#2f6fd0" stroke-width="2.6"/><text class="f-s" x="714" y="76">最小二乘直线</text><text class="f-s" x="100" y="340">拟合不是穿过每个点，而是让所有残差的平方和最小。</text>
