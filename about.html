<style>
  :root{
    --ink:#121c2b;--ink2:#243044;--muted:#4d5b70;--faint:#5f6f85;
    --line:rgba(23,42,74,.10);--line2:rgba(23,42,74,.16);
    --blue:#4051d6;--blue-soft:rgba(64,81,214,.075);
    --stroke:rgba(255,255,255,.78);
    --shadow:0 1px 2px rgba(18,28,43,.03),0 30px 70px -52px rgba(18,35,70,.45);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
    --shell:1160px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:80px;background:#eef4fb}
  body{
    min-height:100vh;font-family:var(--sans);color:var(--ink);font-size:16.5px;line-height:1.85;
    display:flex;flex-direction:column;
    background:
      radial-gradient(1000px 620px at 6% -8%,rgba(64,81,214,.10),transparent 62%),
      radial-gradient(820px 520px at 98% 2%,rgba(34,190,255,.09),transparent 60%),
      radial-gradient(760px 620px at 50% 108%,rgba(15,122,108,.055),transparent 62%),
      linear-gradient(180deg,#f9fcff 0%,#f0f6fd 55%,#f8fbff 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.62;
    background-image:
      linear-gradient(rgba(23,42,74,.042) 1px,transparent 1px),
      linear-gradient(90deg,rgba(23,42,74,.042) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(1200px 820px at 50% 0%,#000 18%,transparent 78%);
    mask-image:radial-gradient(1200px 820px at 50% 0%,#000 18%,transparent 78%);
  }
  a{color:var(--blue);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  :focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
  .wrap{position:relative;z-index:1;flex:1;max-width:var(--shell);margin:0 auto;padding:72px 32px;width:100%}
  .card{
    max-width:560px;padding:38px 40px 34px;border-radius:22px;
    background:linear-gradient(180deg,rgba(255,255,255,.70),rgba(255,255,255,.46));
    -webkit-backdrop-filter:blur(18px) saturate(1.22);
    backdrop-filter:blur(18px) saturate(1.22);
    border:1px solid var(--stroke);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),var(--shadow);
  }
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.16em;color:var(--muted)}
  .kicker::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3.4vw,34px);line-height:1.3;letter-spacing:-.02em;margin:16px 0 14px}
  p{color:var(--ink2);margin-bottom:20px}
  .card a{font-weight:600}
  footer{position:relative;z-index:1;border-top:1px solid var(--line);background:rgba(255,255,255,.44)}
  .foot{
    max-width:var(--shell);margin:0 auto;padding:20px 32px 26px;
    display:flex;justify-content:space-between;align-items:center;gap:10px 22px;flex-wrap:wrap;
    font-size:12.5px;line-height:1.7;color:var(--muted);
  }
  .foot-links{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .foot a{display:inline-flex;align-items:center;min-height:44px;color:var(--muted)}
  .foot a:hover{color:var(--blue)}
  @media (max-width:760px){
    .wrap{padding:40px 20px}
    .card{padding:26px 22px 22px;border-radius:18px}
    .foot{display:block;padding:18px 20px 24px}
    .foot-links{margin-top:6px}
  }
</style>
<style id="sitebar-css">
.sitebar{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid rgba(24,33,47,.08)}
.sb-in{max-width:1160px;margin:0 auto;padding:0 32px;height:62px;display:flex;align-items:center;gap:6px;box-sizing:border-box}
.sb-brand{display:inline-flex;align-items:center;gap:9px;min-height:44px;color:#18212f;font-size:13.5px;font-weight:700;letter-spacing:.01em;text-decoration:none;white-space:nowrap;flex:0 0 auto}
.sb-mark{width:22px;height:22px;border-radius:6px;background:#4051d6;position:relative;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.sb-mark::after{content:"";position:absolute;inset:6px;border:1.5px solid #fff;border-radius:2px;opacity:.92}
.sb-brand small{font-size:11px;font-weight:500;color:#6b7484;letter-spacing:.05em}
.sb-nav{margin-left:auto;display:flex;align-items:center;gap:2px}
.sb-nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;color:#4d5b70;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .18s ease,color .18s ease}
.sb-nav a:hover{background:rgba(64,81,214,.09);color:#4051d6}
.sb-nav a[aria-current="page"]{color:#4051d6;box-shadow:inset 0 -2px 0 #4051d6}
.sb-go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-left:8px;padding:0 16px;border-radius:9px;background:#18212f;color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .18s ease,color .18s ease}
.sb-go:hover{background:#4051d6;color:#fff}
.sb-menu{display:none;position:relative;margin-left:8px}
.sb-menu summary{list-style:none;display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 10px;border-radius:8px;color:#4d5b70;font-size:12.5px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sb-menu summary::-webkit-details-marker{display:none}
.sb-menu summary::marker{content:""}
.sb-burger{width:16px;height:10px;position:relative;display:inline-block}
.sb-burger::before,.sb-burger::after{content:"";position:absolute;left:0;right:0;height:1.5px;background:currentColor;border-radius:2px}
.sb-burger::before{top:0}.sb-burger::after{bottom:0}
.sb-menu[open] summary{background:rgba(64,81,214,.09);color:#4051d6}
.sb-panel{position:absolute;right:0;top:calc(100% + 8px);width:min(260px,calc(100vw - 32px));padding:6px;border-radius:14px;background:rgba(255,255,255,.96);border:1px solid rgba(24,33,47,.10);box-shadow:0 22px 50px -30px rgba(18,28,43,.55);box-sizing:border-box}
.sb-panel a{display:flex;align-items:center;min-height:46px;padding:0 12px;border-radius:9px;color:#243044;font-size:14px;font-weight:600;text-decoration:none}
.sb-panel a:hover{background:rgba(64,81,214,.09);color:#4051d6}
.sb-panel a[aria-current="page"]{color:#4051d6;background:rgba(64,81,214,.07)}
.sitebar a:focus-visible,.sitebar summary:focus-visible{outline:2px solid #4051d6;outline-offset:2px}
@media(max-width:760px){
 .sb-in{height:60px;padding:0 16px;gap:0}
 .sb-brand{font-size:12.5px;gap:8px}
 .sb-brand small,.sb-sub{display:none}
 .sb-nav{display:none}
 .sb-go{margin-left:auto;padding:0 12px;font-size:12px}
 .sb-menu{display:block;margin-left:2px}
}
@media(prefers-reduced-motion:reduce){.sb-nav a,.sb-go{transition:none}}
</style>

<script id="sitebar-js">
(function(){function close(){var d=document.querySelector('.sb-menu[open]');if(d)d.open=false}
document.addEventListener('click',function(e){var d=document.querySelector('.sb-menu[open]');if(d&&!d.contains(e.target))close()});
